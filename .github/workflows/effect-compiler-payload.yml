name: Corrected Effect compiler payload

# The payload is a pure function of the pinned identities this workflow asserts
# (Effect base commit, tsrs and TypeScript source commits, the correction patch
# digest, the component version and `--optimize none`). Those pins moved twice
# in the last 2060 commits of main-ultramodern, so rebuilding four Rust
# compilers per run rebuilt identical bytes. `resolve` restores the per-target
# bytes the default branch already built, verified and staged; the build matrix
# runs only when that restore misses or its recorded identity does not match.
on:
  workflow_call:

  # Seeds the four cache entries every consumer reads, and refreshes their
  # last-access time so GitHub's 7-day eviction never empties them.
  push:
    branches: [main-ultramodern]

  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  resolve:
    name: Effect compiler (cached identity)
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'depot-ubuntu-24.04-8' }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    outputs:
      hit: ${{ steps.payload.outputs.hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      # The epoch is the one key component no file digest can derive: a runner
      # image can ship a new rustc under an unchanged label.
      - name: Identify the cacheable payload key
        id: cache-key
        env:
          EPOCH_FILE: .github/effect-compiler-cache-epoch
        run: |
          set -euo pipefail
          epoch="$(grep -Ev '^[[:space:]]*(#|$)' "$EPOCH_FILE" | tr -d '[:space:]')"
          case "$epoch" in
            '' | *[!0-9]*)
              echo "::error::$EPOCH_FILE must hold exactly one integer line"
              exit 1
              ;;
          esac
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"

      # No restore-keys anywhere below: a prefix match would accept bytes built
      # from a different pin set. enableCrossOsArchive keeps the Windows-saved
      # entry readable here.
      - name: Restore the cached darwin-arm64 compiler
        id: cache-darwin-arm64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .effect-compiler-cache/darwin-arm64
          key: effect-compiler-payload-v2-${{ steps.cache-key.outputs.epoch }}-darwin-arm64-${{ vars.DEPOT_MACOS_RUNNER || 'depot-macos-26' }}-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/source.json') }}-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/constraint.patch') }}-${{ hashFiles('.github/workflows/effect-compiler-payload.yml') }}
          enableCrossOsArchive: true

      - name: Restore the cached linux-x64 compiler
        id: cache-linux-x64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .effect-compiler-cache/linux-x64
          key: effect-compiler-payload-v2-${{ steps.cache-key.outputs.epoch }}-linux-x64-depot-ubuntu-24.04-8-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/source.json') }}-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/constraint.patch') }}-${{ hashFiles('.github/workflows/effect-compiler-payload.yml') }}
          enableCrossOsArchive: true

      - name: Restore the cached linux-arm64 compiler
        id: cache-linux-arm64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .effect-compiler-cache/linux-arm64
          key: effect-compiler-payload-v2-${{ steps.cache-key.outputs.epoch }}-linux-arm64-depot-ubuntu-24.04-arm-8-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/source.json') }}-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/constraint.patch') }}-${{ hashFiles('.github/workflows/effect-compiler-payload.yml') }}
          enableCrossOsArchive: true

      - name: Restore the cached win32-x64 compiler
        id: cache-win32-x64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .effect-compiler-cache/win32-x64
          key: effect-compiler-payload-v2-${{ steps.cache-key.outputs.epoch }}-win32-x64-${{ vars.DEPOT_WINDOWS_RUNNER || 'depot-windows-2025-8' }}-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/source.json') }}-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/constraint.patch') }}-${{ hashFiles('.github/workflows/effect-compiler-payload.yml') }}
          enableCrossOsArchive: true

      # Fail closed on a wrong restore: a partial restore or bytes whose
      # recorded identity differs from the committed source rebuilds the whole
      # matrix instead of staging anything.
      - name: Verify every restored target against the committed source identity
        id: identity
        env:
          RESTORED: |
            darwin-arm64 ${{ steps.cache-darwin-arm64.outputs.cache-hit }}
            linux-x64 ${{ steps.cache-linux-x64.outputs.cache-hit }}
            linux-arm64 ${{ steps.cache-linux-arm64.outputs.cache-hit }}
            win32-x64 ${{ steps.cache-win32-x64.outputs.cache-hit }}
        run: |
          set -euo pipefail
          usable=true
          while read -r target restored; do
            [ -n "$target" ] || continue
            if [ "$restored" != 'true' ]; then
              echo "::warning::No cached Effect compiler for $target; building every target"
              usable=false
              continue
            fi
            if ! node scripts/ultramodern-publish/stage-effect-compiler-payload.mjs verify-identity \
              --input ".effect-compiler-cache/$target/source-identity.json" --target "$target"; then
              echo "::warning::Cached $target does not match the committed compiler source identity; building every target"
              usable=false
            fi
          done <<< "$RESTORED"
          echo "usable=$usable" >> "$GITHUB_OUTPUT"

      - name: Produce the target inventory and same-run receipt
        if: steps.identity.outputs.usable == 'true'
        env:
          TARGETS: darwin-arm64 linux-x64 linux-arm64 win32-x64
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            node scripts/ultramodern-publish/stage-effect-compiler-payload.mjs produce \
              --artifact-dir ".effect-compiler-cache/$target/artifact" --target "$target" \
              --output ".modern/effect-compiler-targets/$target"
          done

      - name: Validate and stage the complete compiler payload
        if: steps.identity.outputs.usable == 'true'
        run: node scripts/ultramodern-publish/stage-effect-compiler-payload.mjs stage --input .modern/effect-compiler-targets

      # The win32 and darwin smokes run only in the jobs that build those
      # targets. Here the Linux binary proves the restored bytes execute and
      # type-check with their own adjacent lib files; the Effect diagnostic leg
      # needs the pinned tsgo fixture tree, which this job does not check out.
      #
      # It smokes the staged payload rather than the restored cache directory,
      # because the cached bytes now travel as an artifact and arrive without
      # their executable mode. The stager is the only thing allowed to repair
      # that mode, and it does so from the inventory it just verified, so
      # smoking after staging also smokes exactly the bytes consumers get
      # rather than a copy of them.
      - name: Smoke the cached Linux release binary
        if: steps.identity.outputs.usable == 'true'
        timeout-minutes: 5
        env:
          ARTIFACT_DIR: packages/solutions/app-tools-extensions/compiler/payload/linux-x64
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          const directory = path.resolve(process.env.ARTIFACT_DIR);
          const binary = path.join(directory, 'tsrs');
          const run = args => {
            const result = spawnSync(binary, args, { encoding: 'utf8', timeout: 120000 });
            assert.ifError(result.error);
            assert.equal(result.signal, null);
            return result;
          };
          assert.ok(fs.statSync(path.join(directory, 'lib.d.ts')).isFile());
          assert.ok(fs.readdirSync(directory).filter(name => name.endsWith('.d.ts')).length > 10);
          const version = run(['--version']);
          assert.equal(version.status, 0, version.stderr);
          assert.equal(version.stdout.trim(), 'Version 7.1.0-beta+effect-tsgo.0.67.0 (tsrs 0.21.0-ts7.1.0-beta, microsoft/TypeScript@3e9236361fa9)');
          const root = fs.mkdtempSync(path.join(os.tmpdir(), 'release-smoke-'));
          try {
            const config = { compilerOptions: { strict: true, target: 'ESNext', module: 'NodeNext', noEmit: true, skipLibCheck: true, types: [] }, files: ['index.ts'] };
            fs.writeFileSync(path.join(root, 'tsconfig.json'), JSON.stringify(config));
            fs.writeFileSync(path.join(root, 'index.ts'), 'const values: Array<number> = [1];\nconsole.log(values.length.toFixed(0));\n');
            const checked = run(['--project', root, '--pretty', 'false']);
            assert.equal(checked.status, 0, checked.stdout + checked.stderr);
            assert.doesNotMatch(checked.stdout, /error TS/);
          } finally { fs.rmSync(root, { recursive: true, force: true }); }
          JS

      - name: Upload the complete staged payload
        if: steps.identity.outputs.usable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: effect-compiler-payload-${{ github.sha }}
          path: packages/solutions/app-tools-extensions/compiler/payload
          include-hidden-files: true
          if-no-files-found: error

      - name: Report the cached payload as this run's payload
        id: payload
        if: steps.identity.outputs.usable == 'true'
        run: echo "hit=true" >> "$GITHUB_OUTPUT"

  build:
    name: Effect compiler (${{ matrix.target }})
    needs: resolve
    if: needs.resolve.outputs.hit != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            rust_target: aarch64-apple-darwin
            runner: ${{ vars.DEPOT_MACOS_RUNNER || 'depot-macos-26' }}
          - target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            # Ubuntu 24.04 is the repository's minimum, so the compiler's glibc
            # baseline is 2.39: these binaries do not run on older Linux. The
            # label is literal, not the configurable framework runner, so the
            # shipped baseline cannot move with a repository variable.
            runner: depot-ubuntu-24.04-8
          - target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            runner: depot-ubuntu-24.04-arm-8
          - target: win32-x64
            rust_target: x86_64-pc-windows-msvc
            runner: ${{ vars.DEPOT_WINDOWS_RUNNER || 'depot-windows-2025-8' }}
    steps:
      - name: Verify the supported Apple Silicon runner
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          chip="$(sysctl -n machdep.cpu.brand_string)"
          if ! printf '%s\n' "$chip" | grep -Eq '^Apple M([3-9]|[1-9][0-9]+)( |$)'; then
            echo "::error::macOS compiler builds require Apple Silicon M3 or newer; got $chip"
            exit 1
          fi

      - name: Configure native Windows checkout
        if: runner.os == 'Windows'
        run: |
          git config --system core.longpaths true
          git config --system core.autocrlf false

      # Keep the original local setup action at the workspace root: it resolves
      # component paths relative to GITHUB_WORKSPACE, not the action directory.
      - name: Checkout the exact Effect compiler base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Effect-TS/tsgo
          ref: 3cbaa7bc6f149b83d4d3c2f67ef95f8426487d8e
          persist-credentials: false

      - name: Checkout the production correction and staging CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false

      - name: Verify source contract and add the exact production correction
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const root = 'harness/packages/solutions/app-tools-extensions/compiler';
          const source = JSON.parse(fs.readFileSync(`${root}/source.json`));
          assert.equal(source.effect.baseCommit, '3cbaa7bc6f149b83d4d3c2f67ef95f8426487d8e');
          assert.equal(source.tsrs.sourceCommit, '38931a58019107ba31581791e26a7aa414c9e015');
          assert.equal(source.typescript.sourceCommit, '3e9236361fa97a9e6c685f4833ac457ae2d8c50a');
          assert.equal(source.optimization, 'none');
          const patch = fs.readFileSync(`${root}/constraint.patch`);
          assert.equal(createHash('sha256').update(patch).digest('hex'), source.patchSha256);
          fs.writeFileSync('_patches/tsrs/035-checker-base-constraint-identity.patch', patch, { flag: 'wx' });
          JS

      - name: Materialize the original tsrs component
        uses: ./.github/actions/setup-repo
        with:
          component: tsrs
          version: 0.21.0-ts7.1.0-beta
          target: ${{ matrix.target }}

      - name: Verify materialized source identities
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          test "$(git rev-parse HEAD)" = 3cbaa7bc6f149b83d4d3c2f67ef95f8426487d8e
          test "$(git -C tsrs rev-parse HEAD)" = 38931a58019107ba31581791e26a7aa414c9e015
          test "$(git -C typescript rev-parse HEAD)" = 3e9236361fa97a9e6c685f4833ac457ae2d8c50a
          rustup target add "$RUST_TARGET"
          pnpm exec repoctl tsrs port-check

      - name: Build the complete release artifact and noembed libraries
        id: compiler
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          pnpm exec repoctl build artifact --component tsrs
          --version 0.21.0-ts7.1.0-beta --target "$TARGET" --optimize none

      - name: Setup Node.js 26.12.0 for release smoke and staging
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      - name: Smoke the actual release binary, libraries, API and Effect diagnostics
        timeout-minutes: 10
        env:
          ARTIFACT_DIR: ${{ steps.compiler.outputs.artifact_path }}
          TARGET: ${{ matrix.target }}
        run: |
          node --conditions=@typescript/source --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { Client } from './typescript/packages/typescript/src/api/sync/client.ts';
          const binary = path.resolve(process.env.ARTIFACT_DIR, process.env.TARGET === 'win32-x64' ? 'tsrs.exe' : 'tsrs');
          const run = args => {
            const result = spawnSync(binary, args, { encoding: 'utf8', timeout: 120000 });
            assert.ifError(result.error);
            assert.equal(result.signal, null);
            return result;
          };
          assert.ok(fs.statSync(path.join(process.env.ARTIFACT_DIR, 'lib.d.ts')).isFile());
          assert.ok(fs.readdirSync(process.env.ARTIFACT_DIR).filter(name => name.endsWith('.d.ts')).length > 10);
          const version = run(['--version']);
          assert.equal(version.status, 0, version.stderr);
          assert.equal(version.stdout.trim(), 'Version 7.1.0-beta+effect-tsgo.0.67.0 (tsrs 0.21.0-ts7.1.0-beta, microsoft/TypeScript@3e9236361fa9)');
          const client = new Client({ tsserverPath: binary });
          try { assert.equal(client.echo('release-api-smoke'), 'release-api-smoke'); }
          finally { client.close(); }
          // This uses the existing pinned Effect fixture dependency, not a shim.
          const root = fs.mkdtempSync(path.resolve('testdata/tests/effect-v4/release-smoke-'));
          try {
            fs.writeFileSync(path.join(root, 'index.ts'), 'import { Effect } from "effect";\nEffect.succeed("floating");\n');
            const config = { compilerOptions: { strict: true, target: 'ESNext', module: 'NodeNext', noEmit: true, skipLibCheck: true, plugins: [{ name: '@effect/language-service', diagnosticSeverity: { floatingEffect: 'error' } }] }, files: ['index.ts'] };
            fs.writeFileSync(path.join(root, 'tsconfig.json'), JSON.stringify(config));
            fs.writeFileSync(path.join(root, 'index.ts'), 'const values: Array<number> = [1];\nconsole.log(values);\n');
            const valid = run(['--project', root, '--pretty', 'false']);
            assert.equal(valid.status, 0, valid.stdout + valid.stderr);
            fs.writeFileSync(path.join(root, 'index.ts'), 'import { Effect } from "effect";\nEffect.succeed("floating");\n');
            const result = run(['--project', root, '--pretty', 'false']);
            assert.equal(result.status, 2, result.stdout + result.stderr);
            assert.match(result.stdout, /377001/);
            assert.doesNotMatch(result.stdout, /TS(?:2318|6053|2307)/);
          } finally { fs.rmSync(root, { recursive: true, force: true }); }
          JS

      - name: Include source licenses and static dependency notices before receipt creation
        env:
          ARTIFACT_DIR: ${{ steps.compiler.outputs.artifact_path }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          const notices = path.join(process.env.ARTIFACT_DIR, 'notices');
          fs.mkdirSync(notices);
          for (const [source, name] of [['LICENSE', 'LICENSE-Effect'], ['tsrs/LICENSE', 'LICENSE-tsrs'], ['typescript/LICENSE.txt', 'LICENSE-TypeScript'], ['tsrs/NOTICE', 'NOTICE-tsrs'], ['typescript/NOTICE.txt', 'NOTICE-TypeScript'], ['tsrs/licenses/Go-LICENSE', 'LICENSE-Go']]) {
            fs.copyFileSync(source, path.join(notices, name));
          }
          const metadata = JSON.parse(execFileSync('cargo', ['metadata', '--locked', '--format-version', '1'], { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 }));
          const sections = [];
          for (const pkg of metadata.packages.filter(pkg => pkg.source !== null)) {
            const root = path.dirname(pkg.manifest_path);
            const files = new Set();
            if (pkg.license_file) files.add(path.resolve(root, pkg.license_file));
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              if (entry.isFile() && /^(?:licen[sc]e|copying|notice|copyright|authors)(?:[._-]|$)/i.test(entry.name)) files.add(path.join(root, entry.name));
              if (entry.isDirectory() && /^licenses?$/i.test(entry.name)) {
                for (const name of fs.readdirSync(path.join(root, entry.name), { recursive: true })) {
                  const file = path.join(root, entry.name, name);
                  if (fs.statSync(file).isFile()) files.add(file);
                }
              }
            }
            assert.ok(files.size, `Missing static dependency license text: ${pkg.name}@${pkg.version}`);
            sections.push(`${pkg.name}@${pkg.version} (${pkg.license ?? 'license-file'})\n${[...files].sort().map(file => fs.readFileSync(file, 'utf8')).join('\n')}`);
          }
          fs.writeFileSync(path.join(notices, 'THIRD-PARTY-NOTICES'), sections.join('\n\n========================================\n\n'));
          JS

      # A byte-identical copy at a path that does not depend on the runner or
      # the target: actions/cache keys its entry version on the literal paths,
      # so the win32 save and the Linux restore must name the same directory.
      # The receipt is deliberately not part of it; it is run-identity bound and
      # is produced again in whichever run consumes these bytes.
      - name: Copy the verified target directory and record its source identity
        env:
          ARTIFACT_DIR: ${{ steps.compiler.outputs.artifact_path }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const root = path.join('.effect-compiler-cache', process.env.TARGET);
          const copy = path.join(root, 'artifact');
          fs.mkdirSync(root, { recursive: true });
          fs.cpSync(process.env.ARTIFACT_DIR, copy, { recursive: true, dereference: false, errorOnExist: true, force: false, preserveTimestamps: true });
          const walk = (base, relative = '') => fs.readdirSync(path.join(base, relative), { withFileTypes: true }).sort((left, right) => left.name < right.name ? -1 : 1).flatMap(entry => {
            const next = relative ? `${relative}/${entry.name}` : entry.name;
            return entry.isDirectory() ? walk(base, next) : [next];
          });
          const sum = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const original = walk(process.env.ARTIFACT_DIR);
          assert.deepEqual(walk(copy), original, 'cached copy does not list the built artifact');
          let bytes = 0;
          for (const file of original) {
            const source = path.join(process.env.ARTIFACT_DIR, file);
            assert.equal(sum(path.join(copy, file)), sum(source), `cached copy differs: ${file}`);
            bytes += fs.statSync(source).size;
          }
          console.log(`Cacheable ${process.env.TARGET} directory: ${original.length} files, ${(bytes / 1024 / 1024).toFixed(2)} MB`);
          JS
          node harness/scripts/ultramodern-publish/stage-effect-compiler-payload.mjs write-identity \
            --output ".effect-compiler-cache/$TARGET/source-identity.json" --target "$TARGET"

      - name: Produce the target inventory and same-run receipt
        env:
          ARTIFACT_DIR: ${{ steps.compiler.outputs.artifact_path }}
          TARGET: ${{ matrix.target }}
        run: >-
          node harness/scripts/ultramodern-publish/stage-effect-compiler-payload.mjs produce
          --artifact-dir "$ARTIFACT_DIR" --target "$TARGET"
          --output .modern/effect-compiler-target

      # This job does NOT write the cache entry for the target it just built,
      # and that is measured rather than stylistic. Depot serves the Actions
      # cache from its own backend, and that backend does not span CPU
      # architectures: in run 43889178478 the x64 `resolve` job restored
      # linux-x64 and win32-x64 (saved on x64 Linux and x64 Windows) and
      # reported "Cache not found" for darwin-arm64 and linux-arm64, whose
      # entries this matrix had just written from arm64 machines with
      # byte-identical keys. Four writers on four architectures therefore
      # cannot be read by one reader, and a partial restore rebuilds
      # everything. So every entry is written by `aggregate` on x64 Linux, the
      # same architecture `resolve` reads from, out of this artifact.
      #
      # Mode stripping across artifact transport is not a problem here: the
      # cached bytes are the pre-receipt artifact directory, and
      # stage-effect-compiler-payload.mjs derives `executable` from which file
      # is the target's binary (line 316) and restores 0o755 itself when it
      # copies the inventory (line 216), so it never reads a filesystem mode.
      - name: Upload the verified target directory for the cache writer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: effect-compiler-cache-${{ matrix.target }}-${{ github.sha }}
          path: .effect-compiler-cache/${{ matrix.target }}
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload the complete target directory and receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: effect-compiler-target-${{ matrix.target }}-${{ github.sha }}
          path: .modern/effect-compiler-target
          include-hidden-files: true
          if-no-files-found: error

  aggregate:
    needs: [resolve, build]
    if: needs.resolve.outputs.hit != 'true'
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'depot-ubuntu-24.04-8' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'
      - name: Download supported target receipts into artifact-named directories
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: effect-compiler-target-*-${{ github.sha }}
          path: .modern/effect-compiler-targets
          merge-multiple: false
      - name: Validate and stage the complete compiler payload
        run: node scripts/ultramodern-publish/stage-effect-compiler-payload.mjs stage --input .modern/effect-compiler-targets
      - name: Upload the complete staged payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: effect-compiler-payload-${{ github.sha }}
          path: packages/solutions/app-tools-extensions/compiler/payload
          include-hidden-files: true
          if-no-files-found: error

      # Every entry is written here, on the one architecture `resolve` reads
      # from, and only after the step above accepted the complete payload - so
      # a run that cannot produce a valid inventory for all four targets seeds
      # nothing. The four keys below must stay byte-identical to the four
      # restores in `resolve`; they are printed on every run, including pull
      # requests, so a drift is visible without waiting for a restore to miss.
      - name: Download the verified target directories to cache
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: effect-compiler-cache-*-${{ github.sha }}
          path: .effect-compiler-cache-upload
          merge-multiple: false

      # Lay the four directories out exactly as `resolve` restores them, and
      # fail closed if a target is missing rather than seeding a partial set
      # that would make every later run restore two of four and rebuild all.
      - name: Identify the cacheable payload key
        id: cache-key
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          EPOCH_FILE: .github/effect-compiler-cache-epoch
          TARGETS: darwin-arm64 linux-x64 linux-arm64 win32-x64
        run: |
          set -euo pipefail
          epoch="$(grep -Ev '^[[:space:]]*(#|$)' "$EPOCH_FILE" | tr -d '[:space:]')"
          case "$epoch" in
            '' | *[!0-9]*)
              echo "::error::$EPOCH_FILE must hold exactly one integer line"
              exit 1
              ;;
          esac
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          for target in $TARGETS; do
            from=".effect-compiler-cache-upload/effect-compiler-cache-$target-${{ github.sha }}"
            if [ ! -f "$from/source-identity.json" ] || [ ! -d "$from/artifact" ]; then
              echo "::error::$from is not a complete cacheable target directory"
              exit 1
            fi
            mkdir -p .effect-compiler-cache
            mv "$from" ".effect-compiler-cache/$target"
            printf 'Cacheable %s directory: %s\n' "$target" \
              "$(du -sh ".effect-compiler-cache/$target" | cut -f1)"
          done

      - name: Save the verified darwin-arm64 compiler
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .effect-compiler-cache/darwin-arm64
          key: effect-compiler-payload-v2-${{ steps.cache-key.outputs.epoch }}-darwin-arm64-${{ vars.DEPOT_MACOS_RUNNER || 'depot-macos-26' }}-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/source.json') }}-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/constraint.patch') }}-${{ hashFiles('.github/workflows/effect-compiler-payload.yml') }}
          enableCrossOsArchive: true

      - name: Save the verified linux-x64 compiler
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .effect-compiler-cache/linux-x64
          key: effect-compiler-payload-v2-${{ steps.cache-key.outputs.epoch }}-linux-x64-depot-ubuntu-24.04-8-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/source.json') }}-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/constraint.patch') }}-${{ hashFiles('.github/workflows/effect-compiler-payload.yml') }}
          enableCrossOsArchive: true

      - name: Save the verified linux-arm64 compiler
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .effect-compiler-cache/linux-arm64
          key: effect-compiler-payload-v2-${{ steps.cache-key.outputs.epoch }}-linux-arm64-depot-ubuntu-24.04-arm-8-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/source.json') }}-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/constraint.patch') }}-${{ hashFiles('.github/workflows/effect-compiler-payload.yml') }}
          enableCrossOsArchive: true

      - name: Save the verified win32-x64 compiler
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .effect-compiler-cache/win32-x64
          key: effect-compiler-payload-v2-${{ steps.cache-key.outputs.epoch }}-win32-x64-${{ vars.DEPOT_WINDOWS_RUNNER || 'depot-windows-2025-8' }}-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/source.json') }}-${{ hashFiles('packages/solutions/app-tools-extensions/compiler/constraint.patch') }}-${{ hashFiles('.github/workflows/effect-compiler-payload.yml') }}
          enableCrossOsArchive: true
