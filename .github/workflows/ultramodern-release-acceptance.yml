name: UltraModern Packed Release Acceptance

on:
  workflow_call:
    inputs:
      required_renderer_features:
        default: false
        type: boolean
      producer_artifact_identity:
        required: true
        type: string
      producer_run_attempt:
        required: true
        type: string
      producer_run_identity:
        required: true
        type: string
      release_source_commit:
        required: true
        type: string
    outputs:
      producer_artifact_identity:
        value: ${{ jobs.accept-release.outputs.producer_artifact_identity }}
      producer_run_attempt:
        value: ${{ jobs.accept-release.outputs.producer_run_attempt }}
      producer_run_identity:
        value: ${{ jobs.accept-release.outputs.producer_run_identity }}
      release_source_commit:
        value: ${{ jobs.accept-release.outputs.release_source_commit }}

permissions:
  actions: read
  contents: read

env:
  BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT: bleedingdev-release-bundle
  BLEEDINGDEV_RELEASE_ACCEPTANCE_ARTIFACT: bleedingdev-release-acceptance
  BLEEDINGDEV_RELEASE_MANIFEST: .modern/bleedingdev-publish/manifest.json
  BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT: .modern/bleedingdev-publish/acceptance-receipt.json

jobs:
  accept-release:
    name: Clean-room acceptance of the immutable release bundle
    # Required feature proofs validate a GitHub-hosted RUNNER_TEMP lease.
    runs-on: ${{ inputs.required_renderer_features && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.DEPOT_LINUX_RUNNER || fromJSON(vars.BLEEDINGDEV_ACCEPT_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 180
    outputs:
      producer_artifact_identity: ${{ inputs.producer_artifact_identity }}
      producer_run_attempt: ${{ inputs.producer_run_attempt }}
      producer_run_identity: ${{ inputs.producer_run_identity }}
      release_source_commit: ${{ inputs.release_source_commit }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout acceptance runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache_save: false

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"

      # PR callers restore the shared key seeded by ci-cache.yml; this
      # reusable job never saves a branch-scoped cache.
      - name: Restore pnpm store cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install acceptance runner dependencies
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts --filter @scripts/ultramodern-production-readiness --filter modern-js-monorepo --filter tests

      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT }}-${{ inputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      # Resolves the same browser-smoke runtime the acceptance profile uses and
      # reports its playwright version, so the cache key below comes from a
      # resolved runtime output instead of a workflow version literal. It also
      # exports PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright to the
      # later steps; cache_path is that same directory.
      - name: Resolve browser smoke runtime
        id: browser-runtime
        run: >-
          node scripts/ultramodern-production-readiness/provision-acceptance-browsers.mjs
          --resolve

      # No restore-keys: the resolved playwright version is the invalidation
      # mechanism.
      - name: Restore Playwright chromium cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-runtime.outputs.cache_path }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      # --version carries the version resolved before the restore, so the
      # install fails closed when the runtime present after it is not the one
      # the restored cache was keyed from.
      - name: Install browser smoke runtime
        run: >-
          node scripts/ultramodern-production-readiness/provision-acceptance-browsers.mjs
          --install
          --version ${{ steps.browser-runtime.outputs.version }}

      - name: Create acceptance workspace
        id: acceptance-workspace
        run: echo "path=$(mktemp -d "$RUNNER_TEMP/ultramodern-erp-XXXXXX")" >> "$GITHUB_OUTPUT"

      - name: Run exact-artifact ERP-10 acceptance
        id: erp-acceptance
        env:
          # Preserve the original remote-loader stack before the React bridge wraps it.
          FEDERATION_DEBUG: 'true'
          # Opt-in workspace build parallelism for larger self-hosted runners;
          # unset (the hosted default) leaves the acceptance profile untouched.
          BLEEDINGDEV_ACCEPT_BUILD_CONCURRENCY: ${{ vars.BLEEDINGDEV_ACCEPT_BUILD_CONCURRENCY }}
          PRODUCER_RUN_IDENTITY: ${{ inputs.producer_run_identity }}
          ACCEPTANCE_WORK_DIR: ${{ steps.acceptance-workspace.outputs.path }}
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "$PRODUCER_RUN_IDENTITY" \
            --work-dir "$ACCEPTANCE_WORK_DIR"

      - name: Upload failed ERP diagnostics
        if: failure() && steps.erp-acceptance.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: erp-diagnostics-${{ inputs.producer_artifact_identity }}
          path: |
            ${{ steps.acceptance-workspace.outputs.path }}/**/src/federated-components*.tsx
            ${{ steps.acceptance-workspace.outputs.path }}/**/src/routes/vertical-components*.tsx
            ${{ steps.acceptance-workspace.outputs.path }}/**/.output/bundles/*.js
            ${{ steps.acceptance-workspace.outputs.path }}/**/.output/*mf-manifest*.json
            ${{ steps.acceptance-workspace.outputs.path }}/**/dist/mf-manifest.json
            .modern/production-readiness/browser-smoke/**/*.log
            .modern/production-readiness/browser-smoke/**/*.json
          include-hidden-files: true
          retention-days: 3

      - name: Resolve installed-renderer browser runtime
        id: renderer-browser-runtime
        if: inputs.required_renderer_features
        run: mise exec -- node scripts/lib/browser-provisioning.js --resolve --runtime tests

      - name: Install installed-renderer browser runtime
        if: inputs.required_renderer_features
        run: >-
          mise exec -- node scripts/lib/browser-provisioning.js --install --runtime tests
          --version ${{ steps.renderer-browser-runtime.outputs.version }}

      - name: Install fixed installed-renderer Chrome
        id: renderer-fixed-browser
        if: inputs.required_renderer_features
        run: mise exec -- node scripts/ultramodern-renderers/provision-browser.mjs

      - name: Run exact-bundle installed renderer features
        if: inputs.required_renderer_features
        env:
          RENDERER_BROWSER_EXECUTABLE: ${{ steps.renderer-fixed-browser.outputs.executable_path }}
          PRODUCER_RUN_IDENTITY: ${{ inputs.producer_run_identity }}
        run: |
          test -x "$RENDERER_BROWSER_EXECUTABLE"
          feature_work="$(mktemp -d "$RUNNER_TEMP/renderer-features-XXXXXX")"
          feature_work="$(realpath "$feature_work")"
          export OWNED_TEMP_DIR="$feature_work"
          trap 'rm -rf -- "$feature_work/native-inputs"' EXIT
          mise exec -- node scripts/ultramodern-renderers/native-federation-inputs.mjs \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" --out "$feature_work/native-inputs"
          mise exec -- node scripts/ultramodern-renderers/release.mjs \
            --cohort-dir .modern/bleedingdev-publish --renderers solid,octane --with '' \
            --work-dir "$feature_work" --required-features \
            --browser-executable "$RENDERER_BROWSER_EXECUTABLE" \
            --native-inputs "$feature_work/native-inputs/native-inputs.json" \
            --acceptance-receipt .modern/bleedingdev-publish/acceptance-receipt.json \
            --feature-receipt .modern/bleedingdev-publish/acceptance-receipt.renderer-features.json \
            --run-identity "$PRODUCER_RUN_IDENTITY"

      - name: Preserve renderer feature runtime evidence
        if: always() && inputs.required_renderer_features
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-feature-source-runtime-${{ inputs.producer_artifact_identity }}
          path: ${{ runner.temp }}/renderer-features-*/logs/feature-*
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload release acceptance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BLEEDINGDEV_RELEASE_ACCEPTANCE_ARTIFACT }}-${{ inputs.producer_artifact_identity }}
          path: |
            .modern/bleedingdev-publish/acceptance-receipt.json
            .modern/bleedingdev-publish/acceptance-receipt.operational-independence.json
            .modern/bleedingdev-publish/acceptance-receipt.renderer-features.json
          if-no-files-found: error
          include-hidden-files: true

