name: Publish BleedingDev Packages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish the framework cohort or independently qualified stable sidecars"
        required: true
        type: choice
        options:
          - cohort
          - sidecars
        default: cohort
      sidecar_profile:
        description: "Reviewed package profile for sidecars mode"
        required: true
        type: choice
        options:
          - parser
          - mf-sdk
        default: parser
      version:
        description: "Required only for cohort mode, for example 3.8.3-ultramodern.1"
        required: false
        default: ""
      dry_run:
        description: "Validate the exact release without authorizing publication"
        required: true
        type: boolean
        default: false
      # Recovery always names the run that *produced* the bundle. A recovery
      # dispatch is not itself a producer for recovery purposes: its
      # qualify-source records no receipt (see the job below), so recovering
      # from an earlier recovery run fails closed at the receipt download.
      # Chained recoveries therefore keep pointing at the original producer run
      # and its bundle, never at an intermediate recovery run.
      recovery_run_id:
        description: "Original producer run containing an accepted immutable bundle (never an earlier recovery run)"
        required: false
        type: string
        default: ""
      recovery_run_attempt:
        description: "Producer attempt for the prior accepted immutable bundle"
        required: false
        type: string
        default: ""
      # qualify-source and prepare-release are separate jobs in the recovered
      # run and a native failed-job rerun advances only the jobs that failed, so
      # the attempt that recorded the qualification receipt is not always the
      # attempt that produced the bundle. Blank means "same as
      # recovery_run_attempt"; it is consumed only by the source-qualification
      # receipt, never by the bundle or the acceptance receipt.
      recovery_qualification_attempt:
        description: "Attempt of the producer run whose qualify-source recorded the receipt; blank reuses recovery_run_attempt"
        required: false
        type: string
        default: ""

# id-token: write is granted only to the two registry publish jobs. Publication
# is OIDC-only; all other jobs are read-only.
permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  BLEEDINGDEV_PUBLISH_CONCURRENCY: "8"
  # Both publication modes ship only `latest`; no dispatch or package field
  # may choose another tag. The stale `ultramodern-canary` tag was retired
  # on 2026-08-05 rather than kept alive by hand.
  BLEEDINGDEV_PUBLISH_TAG: latest
  BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT: bleedingdev-release-bundle
  BLEEDINGDEV_RELEASE_ACCEPTANCE_ARTIFACT: bleedingdev-release-acceptance
  BLEEDINGDEV_PUBLISHED_ACCEPTANCE_ARTIFACT: bleedingdev-published-acceptance
  BLEEDINGDEV_RELEASE_IDENTITY_ARTIFACT: bleedingdev-release-identity
  BLEEDINGDEV_PUBLISH_OUTCOME_ARTIFACT: bleedingdev-publish-outcome
  BLEEDINGDEV_SOURCE_QUALIFICATION_ARTIFACT: bleedingdev-source-qualification
  BLEEDINGDEV_RELEASE_DIR: .modern/bleedingdev-publish
  BLEEDINGDEV_RELEASE_MANIFEST: .modern/bleedingdev-publish/manifest.json
  BLEEDINGDEV_RELEASE_MANIFEST_DIGEST: .modern/bleedingdev-publish/manifest.json.sha256
  BLEEDINGDEV_RELEASE_COHORT_DIGEST: .modern/bleedingdev-publish/cohort.sha256
  BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT: .modern/bleedingdev-publish/acceptance-receipt.json
  BLEEDINGDEV_PUBLISHED_ACCEPTANCE_RECEIPT: .modern/bleedingdev-publish/published-acceptance-receipt.json
  BLEEDINGDEV_RELEASE_IDENTITY: .modern/bleedingdev-publish/release-identity.json
  BLEEDINGDEV_PUBLISH_OUTCOME: .modern/bleedingdev-publish/publish-outcome.json
  BLEEDINGDEV_SOURCE_QUALIFICATION: .modern/bleedingdev-publish/source-qualification.json
  BLEEDINGDEV_SIDECAR_PROFILE: ${{ inputs.sidecar_profile }}
  BLEEDINGDEV_SIDECAR_DIR: .modern/bleedingdev-sidecars/bundle
  BLEEDINGDEV_SIDECAR_QUALIFICATION: .modern/bleedingdev-sidecars/qualification.json

# Every live release shares one lock: a newer dispatch queues behind an active
# release instead of cancelling or racing it. A dry run holds no publish
# authority and touches no shared state, so it gets its own group and runs
# alongside anything else.
concurrency:
  group: ${{ inputs.dry_run == true && format('publish-bleedingdev-dry-run-{0}', github.run_id) || 'publish-bleedingdev' }}
  cancel-in-progress: false

jobs:
  publish-security:
    name: Validate publish security
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    if: >-
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern')
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      # Consumer: prepare-release passes this exact version to rewrite.mjs.
      - name: Validate publish inputs
        env:
          PUBLISH_MODE: ${{ inputs.mode }}
          SIDECAR_PROFILE: ${{ inputs.sidecar_profile }}
          PUBLISH_VERSION: ${{ inputs.version }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_RUN_ATTEMPT: ${{ inputs.recovery_run_attempt }}
          RECOVERY_QUALIFICATION_ATTEMPT: ${{ inputs.recovery_qualification_attempt }}
        run: |
          case "$PUBLISH_MODE" in
            cohort)
              [[ "$SIDECAR_PROFILE" == parser ]]
              [[ "$PUBLISH_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-ultramodern\.[1-9][0-9]*$ ]]
              ;;
            sidecars)
              [[ "$SIDECAR_PROFILE" == parser || "$SIDECAR_PROFILE" == mf-sdk ]]
              [[ -z "$PUBLISH_VERSION" && -z "$RECOVERY_RUN_ID" && -z "$RECOVERY_RUN_ATTEMPT" && -z "$RECOVERY_QUALIFICATION_ATTEMPT" ]]
              ;;
            *) exit 1 ;;
          esac
          if [[ -n "$RECOVERY_RUN_ID" || -n "$RECOVERY_RUN_ATTEMPT" ]]; then
            [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$RECOVERY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          fi
          # Optional and independent, but meaningless outside the recovery lane:
          # a qualification attempt without a recovery run would silently name an
          # artifact of this run instead.
          if [[ -n "$RECOVERY_QUALIFICATION_ATTEMPT" ]]; then
            [[ -n "$RECOVERY_RUN_ID" ]]
            [[ "$RECOVERY_QUALIFICATION_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          fi

      # A cohort requires every recipe name. A recovery dispatch instead checks
      # the recovered bundle through reconcile-sidecars.
      - name: Check every sidecar name exists on npm
        if: inputs.mode == 'cohort' && inputs.recovery_run_id == ''
        run: node scripts/ultramodern-publish/publish-sidecars.mjs --check-registry

      # Independent publication checks only its immutable selected profile.
      - name: Check selected sidecar names exist on npm
        if: inputs.mode == 'sidecars'
        run: node scripts/ultramodern-publish/publish-sidecars.mjs --mode sidecars --profile "$BLEEDINGDEV_SIDECAR_PROFILE" --check-registry

  # The integration suites on the exact release commit: a called workflow
  # shares this run's github.sha, so no other run's check is polled. A
  # recovery dispatch runs them on HEAD too, because HEAD's tooling drives the
  # registry.
  integration:
    name: Integration suites on the release commit
    if: >-
      inputs.mode == 'cohort' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern')
    uses: ./.github/workflows/integration-test.yml

  # Run source and tooling qualification beside integration and bundle preparation.
  # This job has no recovery authority. Only qualify-source below can issue a
  # receipt, after both the qualification and integration jobs succeed.
  # Recovery still qualifies this dispatch's publication tooling; its package
  # source is authorized by the original producer's receipt instead.
  qualify-source-compute:
    name: Test the release source and publication tooling
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    if: >-
      inputs.mode == 'cohort' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern')
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        # Full history: "Qualify release source" runs pnpm test:scripts, whose
        # divergence gate derives ownership at eded841256 and diffs from the
        # reviewed upstream provenance 2f4d9c4559. Those commits are unreachable
        # in a shallow clone, so a depth-1 checkout fails release qualification.
        # Matches ultramodern-nightly.yml and
        # boundary-anti-patterns.yml, which check out at fetch-depth: 0 for the
        # same reason.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      # Unconditional: the tooling qualification below needs a workspace, and
      # the recovery lane runs it too.
      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install Dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      # Both lanes, including recovery. A recovery dispatch reuses the recovered
      # run's tarballs, but every line of code that moves them — this workflow
      # file, the two OIDC publish CLIs, the receipt verifiers they call, and
      # the outcome/record tooling — is checked out from *this* dispatch's HEAD.
      # Skipping this in recovery would let an unqualified HEAD drive the
      # registry with id-token: write. It is deliberately proportionate: no
      # package bytes are built, so it costs an install plus a couple of minutes
      # of suites, and the recovery lane still drops the whole framework build,
      # the browser runtime, and the unit suites below.
      - name: Qualify the release publication tooling
        run: |
          mise exec -- pnpm lint
          # test:publish-tooling tests the publication scripts with dependencies
          # installed, so it cannot show that the bare-checkout jobs can load
          # them; the workflow validator walks each bare job's static import
          # closure for that. It runs BEFORE any package is built, so it must
          # stay the pre-build subset: scripts/__tests__ (public declarations,
          # tsgo invocation) needs built @modern-js/utils output and belongs to
          # test:scripts:after-build below.
          #
          # Release jobs use fixed CLI entrypoints covered by this suite.
          # The workflow validator rejects inline Node programs.
          #
          # Built-package image staging runs in the disjoint after-build suite.
          mise exec -- pnpm run test:publish-tooling

      # The source suites below are
      # skipped in the recovery lane: that dispatch publishes the recovered
      # run's bytes, never this run's HEAD, so qualifying HEAD's *source* would
      # qualify a commit nothing publishes. The recovered run's own
      # qualification receipt is verified instead, in qualify-source and
      # again against the recovered manifest in prepare-release.
      #
      # plugin-runtime's boundary-debugger suite drives a real chromium through
      # the playwright the rstest browser fixture resolved from the frozen
      # workspace lockfile — a runtime versioned independently of the ERP
      # browser-smoke runtime. This reads back that installed version, so the
      # key below comes from a resolved runtime instead of a workflow literal
      # or a whole-lockfile hash that every unrelated dependency invalidates.
      - name: Resolve browser qualification runtime
        if: inputs.recovery_run_id == ''
        id: browser-runtime
        run: >-
          node scripts/lib/browser-provisioning.js
          --resolve --runtime tests/integration/rstest/basic-app-rstest-browser

      # No restore-keys: the resolved playwright version is the invalidation
      # mechanism.
      - name: Restore Playwright chromium cache
        if: inputs.recovery_run_id == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-runtime.outputs.cache_path }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      # --version carries the version resolved before the restore, so the
      # install fails closed when the runtime present after it is not the one
      # the restored cache was keyed from.
      - name: Install browser qualification runtime
        if: inputs.recovery_run_id == ''
        run: >-
          node scripts/lib/browser-provisioning.js
          --install --runtime tests/integration/rstest/basic-app-rstest-browser
          --version ${{ steps.browser-runtime.outputs.version }}

      - name: Qualify release source
        if: inputs.recovery_run_id == ''
        run: |
          # Script qualification imports public package entry points, and these
          # suites do not run from source alone: bff-core's fixtures import its
          # own dist/esm-node/index.mjs by absolute path, and the plugin-i18n
          # and plugin-bff type fixtures resolve @modern-js/runtime and
          # @modern-js/create-request through their exports maps, which point at
          # dist/types. The create CLI fixture also loads plugin-i18n and
          # plugin-tanstack from their built public entries. Generated API checks
          # also import code-tools/strict-effect-runtime; its ESM, CJS and type
          # entries must be built, not substituted with source-only fixture stubs.
          # A clean checkout has none of it, so build every tested package and dependency
          # closure before tests. One invocation with every closure so nx plans
          # a single graph; each closure still completes before its first
          # consumer below.
          mise exec -- pnpm \
            --filter "@modern-js/ultramodern-create..." \
            --filter "@modern-js/code-tools..." \
            --filter "@modern-js/app-tools..." \
            --filter "@modern-js/ultramodern-app-tools..." \
            --filter "@modern-js/image..." \
            --filter "@modern-js/runtime..." \
            --filter "@modern-js/plugin-i18n..." \
            --filter "@modern-js/plugin-tanstack..." \
            --filter "@modern-js/plugin-bff..." \
            --filter "@modern-js/bff-core..." \
            build
          mise exec -- pnpm run test:scripts:after-build
          # Source tooling already passed above in both release lanes.
          # This suite adds the remaining script contracts and real image bytes.
          mise exec -- pnpm run check-changeset
          # @modern-js/ultramodern-create's own test script rebuilds only itself; every
          # installed framework boundary it exercises is already built above.
          mise exec -- pnpm --filter @modern-js/ultramodern-create test
          # The behavioural surface of the published runtime packages. Without
          # these, a dispatch on a commit whose ut-* workflows are red would
          # still publish to npm at dist-tag latest.
          mise exec -- pnpm test:ut \
            --project plugin-runtime-node \
            --project plugin-runtime-client \
            --project plugin-i18n-node \
            --project plugin-i18n-client \
            --project @modern-js/plugin-bff \
            --project @modern-js/bff-core

  # The only job that can issue a source qualification receipt. Its two needs
  # run concurrently on this dispatch's exact commit. A failed, cancelled or
  # skipped check cannot authorize a recovery or reach either publish job.
  qualify-source:
    name: Confirm qualified source and integration
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    needs:
      - integration
      - qualify-source-compute
    if: >-
      inputs.mode == 'cohort' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      needs.integration.result == 'success' &&
      needs.qualify-source-compute.result == 'success'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      # The proof a later recovery dispatch needs: the exact commit this job
      # qualified, bound to this run and attempt. Written only after both
      # prerequisite jobs pass, so a failed check uploads nothing and its bundle
      # stays unrecoverable.
      - name: Record the qualified source commit
        if: inputs.recovery_run_id == ''
        run: |
          node scripts/ultramodern-publish/source-qualification.mjs create \
            --out "$BLEEDINGDEV_SOURCE_QUALIFICATION" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload the source qualification receipt
        if: inputs.recovery_run_id == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BLEEDINGDEV_SOURCE_QUALIFICATION_ARTIFACT }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .modern/bleedingdev-publish/source-qualification.json
          if-no-files-found: error
          include-hidden-files: true

      # Recovery lane. A recovered run that never uploaded this receipt — its
      # qualification failed, it predates this contract, or it was itself a
      # recovery run and so recorded none — has no artifact to download, so this
      # job fails and publication stays unreachable.
      #
      # The receipt is addressed by `recovery_qualification_attempt`, which
      # defaults to `recovery_run_attempt`. Both attempts belong to the same
      # producer run, but not necessarily to the same attempt of it: a native
      # failed-job rerun re-runs only the failed jobs, so qualify-source can
      # have passed on attempt 1 while prepare-release only produced the bundle
      # on attempt 2. The bundle and the acceptance receipt stay on
      # `recovery_run_attempt`; only this receipt follows the qualification
      # attempt.
      - name: Download the recovered source qualification receipt
        if: inputs.recovery_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ format('{0}-run-{1}-attempt-{2}', env.BLEEDINGDEV_SOURCE_QUALIFICATION_ARTIFACT, inputs.recovery_run_id, inputs.recovery_qualification_attempt || inputs.recovery_run_attempt) }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ inputs.recovery_run_id }}

      - name: Verify the recovered source qualification receipt
        if: inputs.recovery_run_id != ''
        env:
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_QUALIFICATION_ATTEMPT: ${{ inputs.recovery_qualification_attempt || inputs.recovery_run_attempt }}
        run: |
          node scripts/ultramodern-publish/source-qualification.mjs verify \
            --receipt "$BLEEDINGDEV_SOURCE_QUALIFICATION" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$RECOVERY_RUN_ID" \
            --run-attempt "$RECOVERY_QUALIFICATION_ATTEMPT"

  prepare-release:
    name: Build the immutable @bleedingdev release bundle
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    if: >-
      inputs.mode == 'cohort' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern')
    outputs:
      producer_artifact_identity: ${{ steps.producer-identity.outputs.artifact_identity }}
      producer_run_attempt: ${{ steps.producer-identity.outputs.run_attempt }}
      producer_run_identity: ${{ steps.producer-identity.outputs.run_identity }}
      release_source_commit: ${{ steps.verify-bundle.outputs.source_commit }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        # Full history is kept deliberately: the release bundle is built from
        # the same complete checkout qualify-source qualifies. Matches
        # ultramodern-nightly.yml and boundary-anti-patterns.yml.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install Dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Reject an already published source cohort
        if: inputs.recovery_run_id == ''
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
        run: |
          node scripts/ultramodern-publish/workflow.mjs reject-published-source

      - name: Build Packages
        if: inputs.recovery_run_id == ''
        run: mise exec -- pnpm ultramodern:build-bleedingdev-publish

      - name: Prepare exact release tarballs and manifest
        if: inputs.recovery_run_id == ''
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
          PUBLISH_TAG: ${{ env.BLEEDINGDEV_PUBLISH_TAG }}
        run: |
          # --include-sidecars stages the version-preserving @bleedingdev
          # sidecars beside the cohort (own stable versions, own scope, never
          # rewritten) and validates that every npm: alias literal in the staged
          # cohort names a sidecar this run actually stages, at that exact
          # version. It packs each sidecar once, records its exact digests in
          # sidecars.json, and binds that manifest into manifest.json and the cohort
          # digest. Staging-only by construction: the
          # CLI refuses --include-sidecars together with a publish flag.
          mise exec -- pnpm ultramodern:prepare-bleedingdev-publish -- \
            --version "$PUBLISH_VERSION" \
            --tag "$PUBLISH_TAG" \
            --include-sidecars

      - name: Download previously accepted release bundle
        if: inputs.recovery_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ format('{0}-run-{1}-attempt-{2}', env.BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT, inputs.recovery_run_id, inputs.recovery_run_attempt) }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ inputs.recovery_run_id }}

      - name: Download previous release acceptance receipt
        if: inputs.recovery_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ format('{0}-run-{1}-attempt-{2}', env.BLEEDINGDEV_RELEASE_ACCEPTANCE_ARTIFACT, inputs.recovery_run_id, inputs.recovery_run_attempt) }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ inputs.recovery_run_id }}

      - name: Verify previously accepted release bundle
        if: inputs.recovery_run_id != ''
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_RUN_ATTEMPT: ${{ inputs.recovery_run_attempt }}
        run: |
          recovery_run_identity="github:${GITHUB_REPOSITORY}:run:${RECOVERY_RUN_ID}:attempt:${RECOVERY_RUN_ATTEMPT}"
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --verify-receipt \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "$recovery_run_identity"

      - name: Verify release bundle identity
        id: verify-bundle
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
        run: |
          node scripts/ultramodern-publish/workflow.mjs verify-bundle

      - name: Download the recovered source qualification receipt
        if: inputs.recovery_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ format('{0}-run-{1}-attempt-{2}', env.BLEEDINGDEV_SOURCE_QUALIFICATION_ARTIFACT, inputs.recovery_run_id, inputs.recovery_qualification_attempt || inputs.recovery_run_attempt) }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ inputs.recovery_run_id }}

      # Binds the recovered bytes to the qualification that actually covered
      # them. The ancestry check above only proves the manifest commit precedes
      # this run's HEAD; qualify-source qualifies HEAD, not that commit. Without
      # this step a run whose qualification failed while its producer succeeded
      # leaves a bundle that a later recovery dispatch could promote from an
      # unqualified commit.
      #
      # This is also what makes a decoupled qualification attempt safe. The
      # attempt only says *which artifact to fetch*; the commit binding is what
      # authorizes the reuse, so pointing at a qualification attempt that
      # qualified some other commit fails here rather than promoting it.
      - name: Verify the recovered bundle was qualified at its own source commit
        if: inputs.recovery_run_id != ''
        env:
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_QUALIFICATION_ATTEMPT: ${{ inputs.recovery_qualification_attempt || inputs.recovery_run_attempt }}
          RELEASE_SOURCE_COMMIT: ${{ steps.verify-bundle.outputs.source_commit }}
        run: |
          node scripts/ultramodern-publish/source-qualification.mjs verify \
            --receipt "$BLEEDINGDEV_SOURCE_QUALIFICATION" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$RECOVERY_RUN_ID" \
            --run-attempt "$RECOVERY_QUALIFICATION_ATTEMPT" \
            --expect-commit "$RELEASE_SOURCE_COMMIT"

      # Offline: fails the producer if the staged sidecar lane is malformed,
      # mis-ordered, or not addressed at the cohort package that aliases it, so
      # a broken lane never reaches an OIDC-bearing job.
      - name: Verify the staged sidecar publication lane
        run: |
          node scripts/ultramodern-publish/publish-sidecars.mjs \
            --check-staging \
            --out "$BLEEDINGDEV_RELEASE_DIR" \
            --tag "$BLEEDINGDEV_PUBLISH_TAG"

      - name: Bind immutable producer identity
        id: producer-identity
        run: |
          run_attempt="$GITHUB_RUN_ATTEMPT"
          artifact_identity="run-${GITHUB_RUN_ID}-attempt-${run_attempt}"
          run_identity="github:${GITHUB_REPOSITORY}:run:${GITHUB_RUN_ID}:attempt:${run_attempt}"
          {
            printf 'artifact_identity=%s\n' "$artifact_identity"
            printf 'run_attempt=%s\n' "$run_attempt"
            printf 'run_identity=%s\n' "$run_identity"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT }}-${{ steps.producer-identity.outputs.artifact_identity }}
          path: |
            .modern/bleedingdev-publish/manifest.json
            .modern/bleedingdev-publish/manifest.json.sha256
            .modern/bleedingdev-publish/cohort.sha256
            .modern/bleedingdev-publish/tarballs/*.tgz
            .modern/bleedingdev-publish/sidecars.json
            .modern/bleedingdev-publish/sidecar-tarballs/*.tgz
          if-no-files-found: error
          include-hidden-files: true

  # The same registry reconciliation publish-sidecars performs, without
  # publishing and without OIDC: a dry run of the staged sidecar lane reports
  # what it would do and fails closed on a missing package or any registry
  # content/version mismatch. It needs only the bundle and the publication CLI dependency, so it runs as soon as
  # prepare-release uploads it and gates the expensive clean-room acceptance.
  reconcile-sidecars:
    name: Reconcile the staged sidecars with the registry
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    if: >-
      inputs.mode == 'cohort' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern')
    needs:
      - publish-security
      - prepare-release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact-artifact sidecar CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false

      - name: Install publication CLI dependencies
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts --prod --filter modern-js-monorepo --package-import-method=clone-or-copy

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT }}-${{ needs.prepare-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Validate the sidecar publication lane against the registry
        run: |
          node scripts/ultramodern-publish/publish-sidecars.mjs \
            --dry-run \
            --out "$BLEEDINGDEV_RELEASE_DIR" \
            --tag "$BLEEDINGDEV_PUBLISH_TAG"

  accept-release:
    name: Clean-room acceptance of the immutable release bundle
    if: >-
      inputs.mode == 'cohort' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern')
    needs:
      - prepare-release
      # The cheap registry gates finish long before the bundle does; a
      # registry the release cannot publish to never starts this job.
      - reconcile-sidecars
    uses: ./.github/workflows/ultramodern-release-acceptance.yml
    with:
      required_renderer_features: true
      producer_artifact_identity: ${{ needs.prepare-release.outputs.producer_artifact_identity }}
      producer_run_attempt: ${{ needs.prepare-release.outputs.producer_run_attempt }}
      producer_run_identity: ${{ needs.prepare-release.outputs.producer_run_identity }}
      release_source_commit: ${{ needs.prepare-release.outputs.release_source_commit }}

  validate-release:
    name: Validate accepted @bleedingdev tarballs without publish authority
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    if: >-
      inputs.mode == 'cohort' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      inputs.dry_run == true
    needs:
      - publish-security
      - qualify-source
      - accept-release
      # A dry run is green only when the Tractor rehearsal is.
      - rehearse-tractor
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact-artifact validation CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      - name: Download accepted release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download release acceptance receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_ACCEPTANCE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify exact release acceptance receipt
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --verify-receipt \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "${{ needs.accept-release.outputs.producer_run_identity }}"

      - name: Validate only the accepted tarballs
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
          PUBLISH_TAG: ${{ env.BLEEDINGDEV_PUBLISH_TAG }}
          PUBLISH_CONCURRENCY: ${{ env.BLEEDINGDEV_PUBLISH_CONCURRENCY }}
        run: |
          node scripts/ultramodern-publish/prepare-bleedingdev-packages.mjs \
            --publish-existing \
            --dry-run \
            --out "$BLEEDINGDEV_RELEASE_DIR" \
            --version "$PUBLISH_VERSION" \
            --tag "$PUBLISH_TAG" \
            --publish-concurrency "$PUBLISH_CONCURRENCY"

  # Pre-publication gate. The exact immutable bundle accept-release just proved
  # is seeded into a fresh ephemeral registry inside the callee job, and the
  # pinned Tractor baseline is accepted against it — so a downstream Tractor
  # break is found here rather than after an unrollbackable npm publish. No
  # tarball is built, packed, repacked, or rewritten: the callee downloads the
  # producer's bundle and seeds those exact bytes.
  #
  # Source-mode evidence is permanently non-promotable, by construction rather
  # than by policy: the callee binds and uploads nothing in this mode, so there
  # is no source artifact for anything to download, and both the evidence
  # binder and publish-outcome refuse a report whose mode is not `published`.
  # record-publish-outcome requires this job to have succeeded - a dry run has
  # no publish job to carry a rehearsal failure - but reads nothing from it.
  # The published Tractor job below is untouched and still mandatory.
  #
  # A recovery dispatch replays this gate for free: prepare-release re-uploads
  # the recovered bundle under this run's producer identity, and this job reads
  # that artifact. Nothing is rebuilt from recovered product source.
  rehearse-tractor:
    name: Rehearse Tractor against the immutable bundle
    if: >-
      inputs.mode == 'cohort' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern')
    # Only the immutable bundle is needed here, so the rehearsal runs alongside
    # source qualification and the exact-artifact acceptance instead of behind
    # them. All three remain required by every job that can reach npm.
    needs:
      - publish-security
      - prepare-release
    uses: ./.github/workflows/ultramodern-tractor-downstream.yml
    with:
      mode: source
      release_bundle_artifact: bleedingdev-release-bundle-${{ needs.prepare-release.outputs.producer_artifact_identity }}

  # This path qualifies only the reviewed sidecar recipes. It never builds a
  # framework cohort, issues a cohort receipt, or invokes Tractor.
  prepare-sidecars:
    name: Prepare the immutable sidecar bundle
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    if: >-
      inputs.mode == 'sidecars' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern')
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout the exact sidecar inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      - name: Prepare the exact authenticated sidecar tarballs
        env:
          BLEEDINGDEV_SIDECAR_PROFILE: ${{ inputs.sidecar_profile }}
        run: node scripts/ultramodern-publish/prepare-sidecar-bundle.mjs --profile "$BLEEDINGDEV_SIDECAR_PROFILE" --out "$BLEEDINGDEV_SIDECAR_DIR"

      - name: Upload the immutable sidecar bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: bleedingdev-sidecar-bundle-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .modern/bleedingdev-sidecars/bundle
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  qualify-sidecars:
    name: Qualify the exact sidecar bundle
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    needs:
      - publish-security
      - prepare-sidecars
    if: >-
      inputs.mode == 'sidecars' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      needs.publish-security.result == 'success' &&
      needs.prepare-sidecars.result == 'success'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout the sidecar qualification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      - name: Download the exact sidecar bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: bleedingdev-sidecar-bundle-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .modern/bleedingdev-sidecars/bundle
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Test sidecar artifact and qualification contracts
        run: |
          node --test scripts/ultramodern-publish/__tests__/sidecar-bundle.test.js \
            scripts/ultramodern-publish/__tests__/sidecar-qualification.test.js \
            scripts/ultramodern-publish/__tests__/sidecar-provenance.test.js \
            scripts/ultramodern-publish/__tests__/sidecar-publish-lane.test.js \
            scripts/ultramodern-publish/__tests__/packed-mf-sdk-probe.test.js

      - name: Qualify the exact sidecar artifact
        env:
          BLEEDINGDEV_SIDECAR_PROFILE: ${{ inputs.sidecar_profile }}
        run: |
          node scripts/ultramodern-publish/qualify-sidecar-bundle.mjs \
            --out "$BLEEDINGDEV_SIDECAR_DIR" \
            --receipt "$BLEEDINGDEV_SIDECAR_QUALIFICATION"

      - name: Reconcile qualified sidecars without publication authority
        run: |
          node scripts/ultramodern-publish/publish-sidecars.mjs \
            --mode sidecars \
            --out "$BLEEDINGDEV_SIDECAR_DIR" \
            --qualification "$BLEEDINGDEV_SIDECAR_QUALIFICATION" \
            --tag "$BLEEDINGDEV_PUBLISH_TAG" \
            --dry-run

      - name: Upload the sidecar qualification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: bleedingdev-sidecar-qualification-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .modern/bleedingdev-sidecars/qualification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Sidecars are NOT cohort members: they keep their own stable versions and
  # their own scope, and they are published from this dedicated job strictly
  # BEFORE the cohort. @bleedingdev/modern-js-image pins them through
  # `npm:@bleedingdev/<name>@<exact version>` alias specifiers, which npm can
  # only resolve once those exact versions exist on the registry. `publish`
  # declares this job in `needs`, so a failed or skipped sidecar publication
  # makes the cohort publish unreachable rather than shipping a cohort whose
  # image package cannot install. Trusted publishing only: id-token: write and
  # the npm-publish environment, no token secret.
  publish-sidecars:
    name: Publish the qualified stable sidecars
    # npm provenance rejects self-hosted runners, including Depot.
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    timeout-minutes: 45
    if: >-
      always() &&
      cancelled() == false &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      inputs.dry_run == false &&
      needs.publish-security.result == 'success' &&
      (
        (inputs.mode == 'cohort' && needs.integration.result == 'success' && needs.qualify-source-compute.result == 'success' && needs.qualify-source.result == 'success' && needs.accept-release.result == 'success' && needs.rehearse-tractor.result == 'success') ||
        (inputs.mode == 'sidecars' && needs.prepare-sidecars.result == 'success' && needs.qualify-sidecars.result == 'success')
      )
    needs:
      - prepare-sidecars
      - qualify-sidecars
      - integration
      - qualify-source-compute
      - publish-security
      - qualify-source
      - accept-release
      # Nothing reaches npm until the immutable bundle has already been proven
      # downstream in Tractor against an ephemeral registry.
      - rehearse-tractor
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact-artifact sidecar publish CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false

      - name: Install publication CLI dependencies
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts --prod --filter modern-js-monorepo --package-import-method=clone-or-copy

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      - name: Download accepted release bundle
        if: inputs.mode == 'cohort'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download release acceptance receipt
        if: inputs.mode == 'cohort'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_ACCEPTANCE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify exact release acceptance receipt
        if: inputs.mode == 'cohort'
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --verify-receipt \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "${{ needs.accept-release.outputs.producer_run_identity }}"

      - name: Publish the staged sidecars in alias order
        if: inputs.mode == 'cohort'
        run: |
          # Publish the exact tarball bytes bound by the accepted release identity.
          # An already-published version is reused only when registry integrity
          # and shasum match those accepted bytes, so a re-run after a mid-lane
          # failure converges. Every other registry state - byte drift on that
          # version, a dist-tag pointing
          # elsewhere, a version the dist-tag claims but the registry lacks, a
          # backwards republish - fails the job and therefore the cohort.
          node scripts/ultramodern-publish/publish-sidecars.mjs \
            --out "$BLEEDINGDEV_RELEASE_DIR" \
            --tag "$BLEEDINGDEV_PUBLISH_TAG"

      - name: Download independently qualified sidecar bundle
        if: inputs.mode == 'sidecars'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: bleedingdev-sidecar-bundle-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .modern/bleedingdev-sidecars/bundle
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download sidecar qualification receipt
        if: inputs.mode == 'sidecars'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: bleedingdev-sidecar-qualification-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .modern/bleedingdev-sidecars
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify independently qualified sidecar bytes and receipt
        if: inputs.mode == 'sidecars'
        run: |
          node scripts/ultramodern-publish/publish-sidecars.mjs \
            --mode sidecars \
            --out "$BLEEDINGDEV_SIDECAR_DIR" \
            --qualification "$BLEEDINGDEV_SIDECAR_QUALIFICATION" \
            --check-staging

      - name: Publish independently qualified sidecars
        if: inputs.mode == 'sidecars'
        run: |
          node scripts/ultramodern-publish/publish-sidecars.mjs \
            --mode sidecars \
            --out "$BLEEDINGDEV_SIDECAR_DIR" \
            --qualification "$BLEEDINGDEV_SIDECAR_QUALIFICATION" \
            --tag "$BLEEDINGDEV_PUBLISH_TAG"

  publish:
    name: Publish accepted @bleedingdev tarballs
    # npm provenance rejects self-hosted runners, including Depot.
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    timeout-minutes: 45
    outputs:
      publication_run_attempt: ${{ steps.release-identity.outputs.publication_run_attempt }}
    if: >-
      always() &&
      cancelled() == false &&
      inputs.mode == 'cohort' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      inputs.dry_run == false &&
      needs.publish-security.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.qualify-source-compute.result == 'success' &&
      needs.qualify-source.result == 'success' &&
      needs.accept-release.result == 'success' &&
      needs.rehearse-tractor.result == 'success' &&
      needs.publish-sidecars.result == 'success'
    needs:
      - integration
      - qualify-source-compute
      - publish-security
      - qualify-source
      - accept-release
      # Same pre-publication gate as publish-sidecars, declared explicitly here
      # too rather than relied on transitively.
      - rehearse-tractor
      # Hard ordering gate: the cohort's @bleedingdev/modern-js-image aliases
      # resolve only after these exact sidecar versions are on the registry.
      # A failed or skipped publish-sidecars makes this job unreachable.
      - publish-sidecars
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact-artifact publish CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false

      - name: Install publication CLI dependencies
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts --prod --filter modern-js-monorepo --package-import-method=clone-or-copy

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      - name: Download accepted release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download release acceptance receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_ACCEPTANCE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify exact release acceptance receipt
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --verify-receipt \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "${{ needs.accept-release.outputs.producer_run_identity }}"

      - name: Prepare non-dry-run release identity
        id: release-identity
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ needs.accept-release.outputs.release_source_commit }}
          PRODUCER_ARTIFACT_IDENTITY: ${{ needs.accept-release.outputs.producer_artifact_identity }}
          PRODUCER_RUN_ATTEMPT: ${{ needs.accept-release.outputs.producer_run_attempt }}
          PRODUCER_RUN_IDENTITY: ${{ needs.accept-release.outputs.producer_run_identity }}
          PUBLICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node scripts/ultramodern-publish/workflow.mjs create-published-identity

      - name: Verify accepted renderer features before publication
        env:
          PRODUCER_RUN_IDENTITY: ${{ needs.accept-release.outputs.producer_run_identity }}
        run: |
          node scripts/ultramodern-renderers/verify-feature-receipt.mjs \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --receipt "$BLEEDINGDEV_RELEASE_DIR/acceptance-receipt.renderer-features.json" \
            --acceptance-receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "$PRODUCER_RUN_IDENTITY"

      - name: Publish only the accepted tarballs
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
          PUBLISH_TAG: ${{ env.BLEEDINGDEV_PUBLISH_TAG }}
          PUBLISH_CONCURRENCY: ${{ env.BLEEDINGDEV_PUBLISH_CONCURRENCY }}
        run: |
          node scripts/ultramodern-publish/prepare-bleedingdev-packages.mjs \
            --publish-existing \
            --out "$BLEEDINGDEV_RELEASE_DIR" \
            --version "$PUBLISH_VERSION" \
            --tag "$PUBLISH_TAG" \
            --publish-concurrency "$PUBLISH_CONCURRENCY"

      - name: Upload published release identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BLEEDINGDEV_RELEASE_IDENTITY_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}-publication-attempt-${{ github.run_attempt }}
          path: |
            .modern/bleedingdev-publish/manifest.json
            .modern/bleedingdev-publish/manifest.json.sha256
            .modern/bleedingdev-publish/cohort.sha256
            .modern/bleedingdev-publish/sidecars.json
            .modern/bleedingdev-publish/sidecar-tarballs/*.tgz
            .modern/bleedingdev-publish/tarballs/*.tgz
            .modern/bleedingdev-publish/acceptance-receipt.json
            .modern/bleedingdev-publish/acceptance-receipt.operational-independence.json
            .modern/bleedingdev-publish/acceptance-receipt.renderer-features.json
            .modern/bleedingdev-publish/release-identity.json
          if-no-files-found: error
          include-hidden-files: true

  # This workflow publishes the cohort directly at `latest`. It is already
  # public here; this job immediately verifies the registry bytes in the same
  # workflow. It does not approve a staged cohort or roll publication back.
  # accept-release already built and ran the exact tarballs npm now serves.
  # ERP resolution must reproduce the source receipt closure, then all three
  # renderer feature proofs run again using registry-resolved installed bytes.
  accept-published:
    name: Accept the exact published registry cohort
    # Installed feature proofs validate a GitHub-hosted RUNNER_TEMP lease.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: >-
      always() &&
      cancelled() == false &&
      inputs.mode == 'cohort' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      inputs.dry_run == false &&
      needs.publish.result == 'success' &&
      needs.accept-release.result == 'success'
    needs:
      - publish
      - accept-release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout published acceptance runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18

      - name: Download exact published release identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_IDENTITY_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}-publication-attempt-${{ needs.publish.outputs.publication_run_attempt }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify accepted producer receipt for published acceptance
        env:
          PRODUCER_RUN_IDENTITY: ${{ needs.accept-release.outputs.producer_run_identity }}
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --verify-receipt \
            --expected-mode source \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "$PRODUCER_RUN_IDENTITY"

      - name: Verify exact published release identity
        env:
          PUBLICATION_RUN_ATTEMPT: ${{ needs.publish.outputs.publication_run_attempt }}
          PRODUCER_RUN_IDENTITY: ${{ needs.accept-release.outputs.producer_run_identity }}
        run: |
          node scripts/ultramodern-publish/workflow.mjs verify-published-identity

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"

      # Scoped cache namespace: same rationale as accept-release — this job
      # installs only the @scripts/ultramodern-production-readiness closure.
      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-accept-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-accept-${{ runner.os }}-

      - name: Install published acceptance tools
        timeout-minutes: 20
        run: |
          mise exec -- pnpm install --frozen-lockfile --ignore-scripts \
            --filter @scripts/ultramodern-production-readiness --filter modern-js-monorepo --filter tests

      - name: Await the registry cohort
        timeout-minutes: 20
        env:
          PUBLISH_CONCURRENCY: ${{ env.BLEEDINGDEV_PUBLISH_CONCURRENCY }}
          PUBLISH_TAG: ${{ env.BLEEDINGDEV_PUBLISH_TAG }}
          PUBLISH_VERSION: ${{ inputs.version }}
        run: |
          timeout --signal=TERM --kill-after=15s 15m \
            bash scripts/ultramodern-publish/wait-for-registry-cohort.sh \
            "$BLEEDINGDEV_RELEASE_DIR" "$PUBLISH_CONCURRENCY" \
            "$PUBLISH_VERSION" "$PUBLISH_TAG"

      - name: Run published ERP-10 acceptance
        env:
          PRODUCER_RUN_IDENTITY: ${{ needs.accept-release.outputs.producer_run_identity }}
          PUBLISH_VERSION: ${{ inputs.version }}
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --mode published \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --expected-source-revision "${{ needs.accept-release.outputs.release_source_commit }}" \
            --expected-version "$PUBLISH_VERSION" \
            --scale-profile erp-10 \
            --registry-url https://registry.npmjs.org/ \
            --source-receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --receipt "$BLEEDINGDEV_PUBLISHED_ACCEPTANCE_RECEIPT" \
            --run-identity "$PRODUCER_RUN_IDENTITY"

      - name: Resolve installed-renderer browser runtime
        id: renderer-browser-runtime
        run: mise exec -- node scripts/lib/browser-provisioning.js --resolve --runtime tests

      - name: Install installed-renderer browser runtime
        run: >-
          mise exec -- node scripts/lib/browser-provisioning.js --install --runtime tests
          --version ${{ steps.renderer-browser-runtime.outputs.version }}

      - name: Install pinned installed-renderer browser CLI
        id: renderer-browser-cli
        run: mise exec -- node scripts/ultramodern-renderers/provision-agent-browser.mjs

      - name: Install fixed installed-renderer Chrome
        id: renderer-fixed-browser
        run: mise exec -- node scripts/ultramodern-renderers/provision-browser.mjs

      - name: Run registry-byte installed renderer features
        env:
          RENDERER_AGENT_BROWSER_EXECUTABLE: ${{ steps.renderer-browser-cli.outputs.executable_path }}
          RENDERER_BROWSER_EXECUTABLE: ${{ steps.renderer-fixed-browser.outputs.executable_path }}
          PRODUCER_RUN_IDENTITY: ${{ needs.accept-release.outputs.producer_run_identity }}
        run: |
          test -x "$RENDERER_BROWSER_EXECUTABLE"
          test -x "$RENDERER_AGENT_BROWSER_EXECUTABLE"
          test "$(command -v agent-browser)" = "$RENDERER_AGENT_BROWSER_EXECUTABLE"
          feature_work="$(mktemp -d "$RUNNER_TEMP/renderer-features-XXXXXX")"
          feature_work="$(realpath "$feature_work")"
          export OWNED_TEMP_DIR="$feature_work"
          trap 'rm -rf -- "$feature_work/native-inputs"' EXIT
          mise exec -- node scripts/ultramodern-renderers/native-federation-inputs.mjs \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" --out "$feature_work/native-inputs"
          mise exec -- node scripts/ultramodern-renderers/release.mjs \
            --cohort-dir "$BLEEDINGDEV_RELEASE_DIR" --renderers solid,octane --with '' \
            --work-dir "$feature_work" --required-features \
            --browser-executable "$RENDERER_BROWSER_EXECUTABLE" \
            --native-inputs "$feature_work/native-inputs/native-inputs.json" \
            --acceptance-mode published --registry-url https://registry.npmjs.org/ \
            --source-feature-receipt "$BLEEDINGDEV_RELEASE_DIR/acceptance-receipt.renderer-features.json" \
            --source-acceptance-receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --acceptance-receipt "$BLEEDINGDEV_PUBLISHED_ACCEPTANCE_RECEIPT" \
            --feature-receipt "$BLEEDINGDEV_RELEASE_DIR/published-acceptance-receipt.renderer-features.json" \
            --run-identity "$PRODUCER_RUN_IDENTITY"

      - name: Preserve renderer feature runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-feature-published-runtime-${{ needs.accept-release.outputs.producer_artifact_identity }}-publication-attempt-${{ needs.publish.outputs.publication_run_attempt }}
          path: ${{ runner.temp }}/renderer-features-*/**/*.log
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload published acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BLEEDINGDEV_PUBLISHED_ACCEPTANCE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}-publication-attempt-${{ needs.publish.outputs.publication_run_attempt }}
          path: |
            .modern/bleedingdev-publish/published-acceptance-receipt.json
            .modern/bleedingdev-publish/published-acceptance-receipt.renderer-features.json
          if-no-files-found: error
          include-hidden-files: true

  tractor-downstream:
    name: Accept the exact published cohort in Tractor
    if: >-
      always() &&
      cancelled() == false &&
      inputs.mode == 'cohort' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      inputs.dry_run == false &&
      needs.prepare-release.result == 'success' &&
      needs.publish.result == 'success'
    # Runs beside accept-published rather than behind it. record-publish-outcome
    # below still requires both, so evidence ordering is unchanged; only the
    # scheduling is. The callee re-runs the registry cohort gate itself
    # (wait_for_registry_cohort) because it may now start before this workflow's
    # own cohort wait has passed.
    needs:
      - prepare-release
      - publish
    uses: ./.github/workflows/ultramodern-tractor-downstream.yml
    with:
      # Stated rather than defaulted: this is the only lane whose evidence is
      # promotable, and record-publish-outcome still requires it.
      mode: published
      release_bundle_artifact: bleedingdev-release-bundle-${{ needs.prepare-release.outputs.producer_artifact_identity }}
      wait_for_registry_cohort: true

  record-publish-outcome:
    name: Record the authenticated publish outcome
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.publish-outcome.outputs.artifact_name }}
    needs:
      - publish-security
      - accept-release
      - validate-release
      - publish-sidecars
      - publish
      - accept-published
      # The rehearsal runs in a dry run too, and a dry run has no publish job to
      # carry its failure, so it is required directly below. It contributes a
      # gate only: source evidence is never downloaded, read, or promoted here.
      - rehearse-tractor
      - tractor-downstream
    if: >-
      inputs.mode == 'cohort' &&
      always() &&
      cancelled() == false &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      needs.publish-security.result == 'success' &&
      needs.accept-release.result == 'success' &&
      needs.rehearse-tractor.result == 'success' &&
      (
        (inputs.dry_run == true && needs.validate-release.result == 'success' && needs.rehearse-tractor.result == 'success' && needs.publish-sidecars.result == 'skipped' && needs.publish.result == 'skipped') ||
        (inputs.dry_run == false && needs.publish-sidecars.result == 'success' && needs.publish.result == 'success' && needs.accept-published.result == 'success' && needs.tractor-downstream.result == 'success' && needs.validate-release.result == 'skipped')
      )
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      PRODUCER_ARTIFACT_IDENTITY: ${{ needs.accept-release.outputs.producer_artifact_identity }}
      PRODUCER_RUN_ATTEMPT: ${{ needs.accept-release.outputs.producer_run_attempt }}
      PRODUCER_RUN_IDENTITY: ${{ needs.accept-release.outputs.producer_run_identity }}
      RELEASE_SOURCE_COMMIT: ${{ needs.accept-release.outputs.release_source_commit }}
      PUBLISH_VERSION: ${{ inputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact-outcome recorder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      - name: Download accepted release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_BUNDLE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download release acceptance receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_RELEASE_ACCEPTANCE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download published acceptance evidence
        if: inputs.dry_run == false
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ env.BLEEDINGDEV_PUBLISHED_ACCEPTANCE_ARTIFACT }}-${{ needs.accept-release.outputs.producer_artifact_identity }}-publication-attempt-${{ needs.publish.outputs.publication_run_attempt }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download Tractor acceptance evidence
        if: inputs.dry_run == false
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ needs.tractor-downstream.outputs.evidence_artifact_name }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify accepted producer receipt for the outcome
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --verify-receipt \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --run-identity "$PRODUCER_RUN_IDENTITY"

      - name: Verify published receipt for the outcome
        if: inputs.dry_run == false
        run: |
          node scripts/ultramodern-publish/run-release-acceptance.mjs \
            --verify-receipt \
            --expected-mode published \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --scale-profile erp-10 \
            --receipt "$BLEEDINGDEV_PUBLISHED_ACCEPTANCE_RECEIPT" \
            --run-identity "$PRODUCER_RUN_IDENTITY"

      - name: Create publish outcome
        id: publish-outcome
        run: |
          publication_identity=()
          published_evidence=()
          tractor_evidence=()
          if [[ "$DRY_RUN" == "false" ]]; then
            publication_identity=(
              --publication-run-attempt "${{ needs.publish.outputs.publication_run_attempt }}"
            )
            published_evidence=(
              --published-receipt "$BLEEDINGDEV_PUBLISHED_ACCEPTANCE_RECEIPT"
            )
            tractor_evidence=(
              --tractor-report "$BLEEDINGDEV_RELEASE_DIR/tractor-downstream-acceptance.json"
              --tractor-report-sha256 "${{ needs.tractor-downstream.outputs.report_sha256 }}"
              --tractor-baseline-revision "${{ needs.tractor-downstream.outputs.baseline_revision }}"
            )
          fi
          node scripts/ultramodern-publish/publish-outcome.mjs create \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --manifest-digest "$BLEEDINGDEV_RELEASE_MANIFEST_DIGEST" \
            --cohort-digest "$BLEEDINGDEV_RELEASE_COHORT_DIGEST" \
            --receipt "$BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT" \
            --operational-evidence "${BLEEDINGDEV_RELEASE_ACCEPTANCE_RECEIPT%.json}.operational-independence.json" \
            "${publication_identity[@]}" \
            "${published_evidence[@]}" \
            "${tractor_evidence[@]}" \
            --out "$BLEEDINGDEV_PUBLISH_OUTCOME" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$RELEASE_SOURCE_COMMIT" \
            --version "$PUBLISH_VERSION" \
            --tag "$BLEEDINGDEV_PUBLISH_TAG" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-artifact-identity "$PRODUCER_ARTIFACT_IDENTITY" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --producer-run-identity "$PRODUCER_RUN_IDENTITY" \
            --dry-run "$DRY_RUN" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload publish outcome
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.publish-outcome.outputs.artifact_name }}
          path: |
            .modern/bleedingdev-publish/manifest.json
            .modern/bleedingdev-publish/manifest.json.sha256
            .modern/bleedingdev-publish/cohort.sha256
            .modern/bleedingdev-publish/tarballs/*.tgz
            .modern/bleedingdev-publish/sidecars.json
            .modern/bleedingdev-publish/sidecar-tarballs/*.tgz
            .modern/bleedingdev-publish/acceptance-receipt.json
            .modern/bleedingdev-publish/acceptance-receipt.operational-independence.json
            .modern/bleedingdev-publish/acceptance-receipt.renderer-features.json
            .modern/bleedingdev-publish/published-acceptance-receipt.json
            .modern/bleedingdev-publish/published-acceptance-receipt.renderer-features.json
            .modern/bleedingdev-publish/tractor-downstream-acceptance.json
            .modern/bleedingdev-publish/publish-outcome.json
          if-no-files-found: error
          include-hidden-files: true

      # One concise, truthful delivery-state summary read straight off the
      # authenticated outcome this job just wrote — no new receipt schema, no
      # certification hash, no progress database. Persistent Tractor main
      # promotion is real product delivery this workflow cannot perform itself
      # (it would need cross-repo write credentials this workflow never
      # holds), so it is reported as a required, visible, retryable
      # obligation rather than folded into a silent "done".
      - name: Summarize the publish delivery state
        env:
          TRACTOR_STORE_REPOSITORY: BleedingDev/tractor-store-vertical-demo
        run: |
          node scripts/ultramodern-publish/workflow.mjs summarize-delivery

  publish-change-record:
    name: Publish the cohort change record
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    # The only job that may write to the repository, and it runs strictly after
    # the publish outcome is recorded.
    permissions:
      actions: read
      contents: write
    needs:
      - record-publish-outcome
    if: >-
      inputs.mode == 'cohort' &&
      always() &&
      cancelled() == false &&
      needs.record-publish-outcome.result == 'success' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev' &&
      github.ref == format('refs/heads/{0}', vars.BLEEDINGDEV_PUBLISH_BRANCH || 'main-ultramodern') &&
      inputs.dry_run == false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      - name: Download authenticated publish outcome
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ needs.record-publish-outcome.outputs.artifact_name }}
          path: .modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Generate the cohort change record
        id: change-record
        run: |
          # Immutable source identity comes from the authenticated publish
          # outcome's own manifest.json (downloaded above), never from a
          # second job dependency: the outcome already verified this manifest
          # against the accepted release before uploading it.
          RELEASE_SOURCE_COMMIT="$(node scripts/ultramodern-publish/workflow.mjs source-commit)"
          git checkout --detach "$RELEASE_SOURCE_COMMIT"
          mkdir -p "$BLEEDINGDEV_RELEASE_DIR"
          node scripts/ultramodern-publish/gen-cohort-change-record.mjs \
            --manifest "$BLEEDINGDEV_RELEASE_MANIFEST" \
            --out "$BLEEDINGDEV_RELEASE_DIR/change-record.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_VERSION: ${{ steps.change-record.outputs.version }}
          SOURCE_COMMIT: ${{ steps.change-record.outputs.source_commit }}
        run: |
          set -euo pipefail
          # FORK: this repository carries 271 inherited upstream Modern.js `v*`
          # tags (v1.x .. v3.4.0). `gh release create` REUSES a pre-existing tag
          # and silently ignores --target, so a fork release published under
          # `v$PUBLISH_VERSION` could point at an upstream commit. Namespace the
          # fork's releases away from `v*` and never move an existing tag.
          TAG="ultramodern-v$PUBLISH_VERSION"
          TITLE="@bleedingdev/modern-js-* $PUBLISH_VERSION"
          NOTES="$BLEEDINGDEV_RELEASE_DIR/change-record.md"

          EXISTING_TAG_SHA="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)"
          if [ -n "$EXISTING_TAG_SHA" ] && [ "$EXISTING_TAG_SHA" != "$SOURCE_COMMIT" ]; then
            echo "::error::tag $TAG already exists at $EXISTING_TAG_SHA, not $SOURCE_COMMIT" >&2
            exit 1
          fi

          # Idempotent: the publish job runs BEFORE this one and is
          # unrollbackable, so a re-run must be able to converge instead of
          # failing permanently on an already-created release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file "$NOTES"
          elif [ -n "$EXISTING_TAG_SHA" ]; then
            # The tag already names SOURCE_COMMIT, so no --target: GitHub
            # evaluates an explicit target as a new ref at that commit and, when
            # its .github/workflows differs from the default branch, refuses
            # GITHUB_TOKEN with HTTP 403 even though the tag exists.
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file "$NOTES"
          else
            # Creating the release creates its tag. GitHub refuses that to
            # GITHUB_TOKEN (HTTP 403 "Resource not accessible by integration")
            # whenever the tagged commit's .github/workflows differs from the
            # default branch: it counts as a workflow change, and GITHUB_TOKEN
            # can never hold the `workflows` permission. Name that cause and its
            # recovery instead of the opaque 403; once an owner has pushed the
            # tag, a rerun takes the branch above.
            WORKFLOW_DRIFT="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_COMMIT...$DEFAULT_BRANCH" \
              --jq '[.files[].filename | select(startswith(".github/workflows/"))] | join(" ")')"
            if [ -n "$WORKFLOW_DRIFT" ]; then
              echo "::error::$DEFAULT_BRANCH changed $WORKFLOW_DRIFT after $SOURCE_COMMIT, so GITHUB_TOKEN cannot create tag $TAG. An owner creates it first: gh api repos/$GITHUB_REPOSITORY/git/refs -f ref=refs/tags/$TAG -f sha=$SOURCE_COMMIT" >&2
              exit 1
            fi
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_COMMIT" \
              --title "$TITLE" \
              --notes-file "$NOTES"
          fi

      - name: Explain how to recover the release record
        if: failure()
        run: |
          echo "::error::npm publication succeeded; only the GitHub release record is missing. Resolve the error above, then run: gh run rerun $GITHUB_RUN_ID --failed --repo $GITHUB_REPOSITORY"

      - name: Upload the change record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bleedingdev-change-record-${{ steps.change-record.outputs.version }}
          path: .modern/bleedingdev-publish/change-record.md
          if-no-files-found: error
          include-hidden-files: true
