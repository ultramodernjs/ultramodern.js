name: Native Compatibility

on:
  # Required compatibility checks must report for every pull request and
  # merge-queue entry, including changes outside framework package paths.
  pull_request:
    branches: [main, main-ultramodern]

  merge_group:

  workflow_call:

  workflow_dispatch:
    inputs:
      runtime_patch_handoff:
        description: Generate qualified runtime correction patches for review, without publishing
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

# Reusable workflows inherit the caller's event and workflow identity. Only
# direct PR runs share a cancellation group; release, merge-queue and manual
# runs each retain their own run attempt, including pending runs.
concurrency:
  group: >-
    ${{ format('native-compatibility-{0}-{1}', github.repository_id,
      github.event_name == 'pull_request' &&
      github.workflow_ref == format('{0}/.github/workflows/native-compatibility.yml@{1}', github.repository, github.ref) &&
      format('pr-{0}', github.event.pull_request.number) ||
      format('run-{0}-attempt-{1}', github.run_id, github.run_attempt)) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
      github.workflow_ref == format('{0}/.github/workflows/native-compatibility.yml@{1}', github.repository, github.ref) }}

jobs:
  effect-compiler-payload:
    uses: ./.github/workflows/effect-compiler-payload.yml

  native-framework-contracts:
    needs: effect-compiler-payload
    name: Native framework contracts
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'depot-ubuntu-24.04-8' }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.11.8
          cache_save: false
          install: true

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.13.1'

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Restore only; ci-cache.yml seeds this key on main-ultramodern.
      - name: Restore pnpm store cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test owned compiler payload contracts without native builds
        shell: bash
        run: |
          compiler_contracts="$(mktemp -d "$RUNNER_TEMP/compiler-contracts-XXXXXX")"
          trap 'rm -rf -- "$compiler_contracts"' EXIT
          OWNED_TEMP_DIR="$compiler_contracts" node scripts/ultramodern-publish/test-effect-compiler-contracts.mjs

      - name: Download corrected Effect compiler payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: effect-compiler-payload-${{ github.sha }}
          path: .modern/effect-compiler-input

      # Artifact transport strips executable modes; only the CI stager repairs
      # owned generated output after validating the complete same-run receipt.
      - name: Validate and restage corrected Effect compiler payload
        run: node scripts/ultramodern-publish/stage-effect-compiler-payload.mjs stage --input .modern/effect-compiler-input --complete-manifest

      - name: Prepare
        run: pnpm run prepare-build

      - name: Test emitted Octane Effect-tsrs diagnostics
        run: |
          pnpm --filter @modern-js/app-tools-extensions build
          node packages/solutions/app-tools-extensions/tests/native-server-compiler-public.mjs
          pnpm --filter @modern-js/renderer-octane build
          pnpm --filter @modern-js/renderer-octane test:typecheck

      - name: Test renderer acceptance controls
        run: |
          controls_work="$(mktemp -d "$RUNNER_TEMP/renderer-controls-XXXXXX")"
          trap 'rm -rf -- "$controls_work"' EXIT
          OWNED_TEMP_DIR="$controls_work" node --test \
            scripts/__tests__/rslib-tsrs-options.test.mjs \
            scripts/native-compatibility/packed-workflows.test.mjs \
            scripts/ultramodern-renderers/*.test.mjs \
            packages/runtime/renderer-octane/tests/{package-metadata,latest-profile}.test.mjs \
            packages/toolkit/ultramodern-create/tests/workerd-target-listeners.test.mjs \
            tests/ultramodern-renderers/octane-federation/{artifact-ownership,browser-temporary}.test.mjs \
            tests/ultramodern-renderers/octane-federation-workers/contract.test.mjs

      - name: Resolve Playwright runtime
        id: browser-runtime
        run: node scripts/lib/browser-provisioning.js --resolve --runtime tests

      - name: Restore Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-runtime.outputs.cache_path }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      - name: Install Playwright browsers
        run: >-
          node scripts/lib/browser-provisioning.js --install --runtime tests
          --version ${{ steps.browser-runtime.outputs.version }}

      - name: Test native compatibility
        run: pnpm run validate:native-compatibility --prepared

      # Explicit manual handoff only, after every normal check. PR, merge-queue
      # and reusable release runs never rewrite canonical correction patches.
      - name: Qualify runtime source and write canonical patches
        if: github.event_name == 'workflow_dispatch' && inputs.runtime_patch_handoff == true && github.workflow_ref == format('{0}/.github/workflows/native-compatibility.yml@{1}', github.repository, github.ref)
        shell: bash
        run: |
          pnpm_binary="$(mise which pnpm --tool pnpm@12.21.0)"
          case "$pnpm_binary" in
            /*) ;;
            *) echo "::error::pnpm 12.21.0 binary path is not absolute" >&2; exit 1 ;;
          esac
          if [ "$("$pnpm_binary" --version)" != 12.21.0 ]; then
            echo "::error::selected pnpm is not 12.21.0" >&2
            exit 1
          fi
          owned="$(mktemp -d "$RUNNER_TEMP/runtime-qualify-XXXXXX")"
          trap 'rm -rf -- "$owned"' EXIT
          OWNED_TEMP_DIR="$owned" PNPM_BINARY="$pnpm_binary" \
            node scripts/ultramodern-renderers/octane-corrections/qualify-runtime.mjs --write-patch

      - name: Stage runtime patch handoff receipt
        if: success() && github.event_name == 'workflow_dispatch' && inputs.runtime_patch_handoff == true && github.workflow_ref == format('{0}/.github/workflows/native-compatibility.yml@{1}', github.repository, github.ref)
        env:
          HANDOFF_DIR: ${{ runner.temp }}/runtime-handoff
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PNPM_VERSION: '12.21.0'
          MISE_VERSION: '2026.11.8'
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const handoff = process.env.HANDOFF_DIR;
          const patches = [
            'patches/octane@0.18.0.patch',
            'patches/@octanejs__rspack-plugin@0.2.10.patch',
          ];
          const inputs = [
            'scripts/ultramodern-renderers/octane-corrections/runtime-source.patch',
            'scripts/ultramodern-renderers/octane-corrections/runtime-tests.patch',
          ];
          const describe = file => {
            const bytes = fs.readFileSync(file);
            return {
              path: file,
              bytes: bytes.length,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
            };
          };
          const generated = patches.map(describe);
          fs.mkdirSync(path.join(handoff, 'patches'), { recursive: true });
          for (const file of patches) {
            fs.copyFileSync(file, path.join(handoff, file));
          }
          const receipt = {
            schema: 'runtime-patch-handoff/v1',
            sourceSha: process.env.SOURCE_SHA,
            run: { id: process.env.RUN_ID, attempt: process.env.RUN_ATTEMPT },
            toolchain: {
              node: process.versions.node,
              pnpm: process.env.PNPM_VERSION,
              mise: process.env.MISE_VERSION,
            },
            inputs: inputs.map(describe),
            patches: generated,
          };
          fs.writeFileSync(path.join(handoff, 'receipt.json'), `${JSON.stringify(receipt)}\n`);
          JS

      - name: Upload runtime patch handoff
        if: success() && github.event_name == 'workflow_dispatch' && inputs.runtime_patch_handoff == true && github.workflow_ref == format('{0}/.github/workflows/native-compatibility.yml@{1}', github.repository, github.ref)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-patch-handoff-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-handoff
          if-no-files-found: error

  pack-candidate:
    needs: effect-compiler-payload
    name: Pack the consumer candidate
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'depot-ubuntu-24.04-8' }}
    timeout-minutes: 90
    outputs:
      producer_artifact_identity: ${{ steps.identity.outputs.artifact_identity }}
      producer_run_attempt: ${{ github.run_attempt }}
      producer_run_identity: ${{ steps.identity.outputs.run_identity }}
      release_source_commit: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.11.8
          cache_save: false
          install: true

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.13.1'

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Restore only; ci-cache.yml seeds this key on main-ultramodern.
      - name: Restore pnpm store cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download corrected Effect compiler payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: effect-compiler-payload-${{ github.sha }}
          path: .modern/effect-compiler-input

      # Artifact transport strips executable modes; only the CI stager repairs
      # owned generated output after validating the complete same-run receipt.
      - name: Validate and restage corrected Effect compiler payload
        run: node scripts/ultramodern-publish/stage-effect-compiler-payload.mjs stage --input .modern/effect-compiler-input --complete-manifest

      - name: Build the publishable cohort
        run: pnpm ultramodern:build-bleedingdev-publish

      - name: Prepare the exact candidate and sidecars
        id: identity
        run: |
          stable_version="$(node -p 'require("./packages/toolkit/create/package.json").version')"
          pnpm ultramodern:prepare-bleedingdev-publish -- \
            --version "${stable_version}-ultramodern.${GITHUB_RUN_ID}" \
            --tag ci \
            --include-sidecars
          echo "artifact_identity=run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "run_identity=github:${GITHUB_REPOSITORY}:run:${GITHUB_RUN_ID}:attempt:${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload the immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bleedingdev-release-bundle-${{ steps.identity.outputs.artifact_identity }}
          path: .modern/bleedingdev-publish
          if-no-files-found: error
          include-hidden-files: true

  # The clean-room ERP-10 acceptance and the Tractor rehearsal do not run on
  # pull requests. publish-bleedingdev.yml calls the identical reusable
  # workflows (accept-release, tractor-downstream) on the real bundle before
  # any package reaches npm, so every release still passes both gates.
  native-compatibility:
    name: native-compatibility
    if: always()
    needs: [native-framework-contracts, pack-candidate]
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'depot-ubuntu-24.04-8' }}
    timeout-minutes: 5
    steps:
      - name: Require every consumer contract
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const results = JSON.parse(process.env.RESULTS);
            for (const name of ["native-framework-contracts", "pack-candidate"]) {
              if (results[name]?.result !== "success") {
                console.error(name + ": " + (results[name]?.result ?? "missing"));
                process.exitCode = 1;
              }
            }
          '
