name: Diff

concurrency:
  group: diff-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - main-ultramodern

# Default to read-only; the Build job elevates only what rsdoctor needs.
permissions:
  contents: read

jobs:
  Build:
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-24.04' }}

    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache_save: false
          install: true

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Restore only; ci-cache.yml seeds this key on main-ultramodern.
      - name: Restore pnpm store cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install Dependencies and Build
        run: |
          pnpm install
          pnpm run build:required

      - name: Build Demo Project
        run: |
          cd benchmark/bundle-diff
          RSDOCTOR=1 pnpm run build

      - name: Verify render build output
        run: node --test packages/runtime/render/tests/build.test.mjs

      - name: Report Compressed Size
        uses: web-infra-dev/rsdoctor-action@2fbd50933702502f12d2bbef5273afbfd829a289 # v1.1.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          file_path: 'benchmark/bundle-diff/dist/rsdoctor-data.json'
          target_branch: 'main-ultramodern'
