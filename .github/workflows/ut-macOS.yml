name: Unit Test (macOS)

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events but only for the main branch
  pull_request:
    branches: [main, main-ultramodern]

  merge_group:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Keep the required context on the tests themselves. One 8-core M4 runs the
  # entire suite, installs dependencies once, and requests one scarce Mac slot.
  # There is no upstream build job: prepared outputs are an optional cache.
  ut-mac:
    runs-on: ${{ vars.DEPOT_MACOS_RUNNER || 'depot-macos-26' }}
    timeout-minutes: 15

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.11.8
          cache_save: false
          install: true

      - name: Verify pinned test toolchain
        shell: bash
        run: |
          pnpm_version="$(pnpm --version)"
          node scripts/ci/check-test-toolchain.mjs "$pnpm_version"

      # Reuse installed native files, not the much larger content-addressed store.
      # The unit fixtures that install packages use their own isolated stores.
      - name: Restore installed dependencies
        uses: ./.github/actions/installed-dependencies
        with:
          store-required: 'false'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore prepared build outputs
        id: build-cache
        uses: ./.github/actions/restore-build-cache

      - name: Build Required Pkg
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm run build:required

      # These projects run in Node or jsdom, never in a Playwright browser.
      # Keep build outputs: public-bin and installed-declaration smokes use them.
      - name: Verify installed dependency transport
        run: node --test scripts/ci/__tests__/dependency-snapshot.test.mjs

      - name: Report unit test resources
        run: >-
          node --input-type=module --eval "import os from 'node:os';
          console.log(JSON.stringify({platform:process.platform,
          availableParallelism:os.availableParallelism(),cpuCount:os.cpus().length,
          totalMemoryBytes:os.totalmem(),testFileWorkers:8}))"

      - name: Test
        # macOS time includes user/system CPU for the full pnpm process tree.
        # Compare their sum with elapsed seconds * eight, not elapsed alone.
        run: /usr/bin/time -l pnpm run test:ut:prepared --pool.maxWorkers=8
