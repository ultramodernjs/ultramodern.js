name: UltraModern Tractor Downstream Acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Retain an accepted published-cohort Tractor source commit
        required: true
        type: choice
        options: [published]
        default: published
      release_bundle_run_id:
        description: Successful live publication run containing the exact bundle
        required: true
        type: string
      release_bundle_run_attempt:
        description: Attempt that produced the bundle in that publication run
        required: true
        type: string
        default: '1'
      expected_source_revision:
        description: Exact framework source SHA recorded by the published bundle
        required: true
        type: string
      expected_version:
        description: Exact published UltraModern cohort version
        required: true
        type: string
  workflow_call:
    inputs:
      mode:
        description: >-
          `published` accepts the exact cohort as npm serves it and is the only
          lane that produces promotable evidence. `source` rehearses the same
          immutable bundle before publication: this job starts its own throwaway
          loopback registry, seeds it from the verified bundle tarballs, and
          binds and uploads nothing.
        required: false
        type: string
        default: published
      release_bundle_artifact:
        description: Exact UltraModern release-bundle artifact name from this run
        required: true
        type: string
    outputs:
      baseline_revision:
        description: Immutable Tractor revision exercised by the acceptance
        value: ${{ jobs.tractor-downstream.outputs.baseline_revision }}
      evidence_artifact_name:
        description: Exact same-run Tractor acceptance artifact name
        value: ${{ jobs.tractor-downstream.outputs.evidence_artifact_name }}
      report_sha256:
        description: SHA-256 of the passing Tractor acceptance report
        value: ${{ jobs.tractor-downstream.outputs.report_sha256 }}

# No secrets, no environment, and no id-token: write anywhere in this workflow.
# Both lanes only read a registry - the published one reads npm, the rehearsal
# one reads a loopback registry it started itself - so neither can reach a
# publish credential.
permissions:
  actions: read
  contents: read

jobs:
  tractor-downstream:
    name: Exact cohort passes Tractor Node and workerd acceptance
    # Reusable calls inherit the caller's event, including workflow_dispatch.
    # Only reusable calls supply the required same-run release_bundle_artifact.
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.release_bundle_artifact != '' ||
      (github.repository == 'ultramodernjs/ultramodern.js' &&
       github.actor == 'BleedingDev' &&
       github.triggering_actor == 'BleedingDev' &&
       github.ref == 'refs/heads/main-ultramodern')
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'depot-ubuntu-24.04-8' }}
    # The rehearsal additionally starts and seeds a registry from the bundle
    # before the same downstream work begins.
    timeout-minutes: ${{ inputs.mode == 'source' && 75 || 45 }}
    outputs:
      baseline_revision: ${{ steps.evidence.outputs.baseline_revision }}
      evidence_artifact_name: ${{ steps.evidence.outputs.artifact_name }}
      report_sha256: ${{ steps.evidence.outputs.report_sha256 }}
    steps:
      # Fail closed before anything is checked out: an unknown mode is a
      # caller mistake.
      - name: Validate the acceptance mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            published|source) ;;
            *) echo "::error::unsupported Tractor acceptance mode: $MODE" >&2; exit 1 ;;
          esac

      - name: Validate retained adoption inputs and publication run
        if: github.event_name == 'workflow_dispatch' && inputs.release_bundle_artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.release_bundle_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.release_bundle_run_attempt }}
          EXPECTED_SOURCE: ${{ inputs.expected_source_revision }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          [[ "$PRODUCER_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$PRODUCER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-ultramodern\.[1-9][0-9]*$ ]] || exit 1
          PUBLICATION_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID" |
            jq -er --arg attempt "$PRODUCER_RUN_ATTEMPT" '
              select(
                .conclusion == "success" and
                .run_attempt >= ($attempt | tonumber) and
                .head_branch == "main-ultramodern" and
                .event == "workflow_dispatch" and
                .path == ".github/workflows/publish-bleedingdev.yml"
              ) | .head_sha | select(test("^[0-9a-f]{40}$"))
            ')"
          # Recovery publishes an older qualified bundle with newer publication
          # tooling. Bind that source to the publication's immutable history;
          # the downloaded manifest below must still name EXPECTED_SOURCE exactly.
          gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_SOURCE...$PUBLICATION_HEAD" |
            jq -e --arg sha "$EXPECTED_SOURCE" '
              .merge_base_commit.sha == $sha and
              (.status == "identical" or .status == "ahead")
            '
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/jobs?filter=latest&per_page=100")"
          jq -e 'any(.jobs[]; .name == "Publish accepted @bleedingdev tarballs" and .conclusion == "success")' <<< "$jobs"
          # A green publish run proves only that npm accepted the tarballs. The
          # published cohort is accepted by a green accept-bleedingdev-release
          # run for it, or, for a run that accepted in-run, by its own job.
          if ! jq -e 'any(.jobs[]; .name == "Accept the exact published registry cohort" and .conclusion == "success")' <<< "$jobs" >/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/accept-bleedingdev-release.yml/runs?status=success&per_page=100" |
              jq -e --arg title "Accept published release from run $PRODUCER_RUN_ID" '
                any(.workflow_runs[]; .display_title == $title and .conclusion == "success" and .head_branch == "main-ultramodern" and .event == "workflow_dispatch")
              '
          fi

      - name: Checkout acceptance runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: modernjs
          persist-credentials: false

      # The baseline pin is reviewed source, not workflow YAML. It advances
      # after every accepted Tractor adoption, and a workflow edit landing
      # while a publish run is in flight makes GitHub refuse that run's
      # GITHUB_TOKEN the release tag (publish-change-record), because the
      # tagged commit's .github/workflows then differs from the default branch.
      - name: Resolve the pinned Tractor baseline
        id: baseline
        working-directory: modernjs
        run: |
          read -r revision < scripts/ultramodern-publish/tractor-baseline-revision
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::scripts/ultramodern-publish/tractor-baseline-revision must hold an immutable commit SHA" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable Tractor baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          repository: BleedingDev/tractor-store-vertical-demo
          ref: ${{ steps.baseline.outputs.revision }}
          path: tractor
          persist-credentials: false

      - name: Download exact release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ${{ inputs.release_bundle_artifact || format('bleedingdev-release-bundle-run-{0}-attempt-{1}', inputs.release_bundle_run_id, inputs.release_bundle_run_attempt) }}
          path: modernjs/.modern/bleedingdev-publish
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.release_bundle_artifact == '' && inputs.release_bundle_run_id || github.run_id }}

      - name: Verify retained adoption release identity
        if: github.event_name == 'workflow_dispatch' && inputs.release_bundle_artifact == ''
        working-directory: modernjs
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source_revision }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          jq -e --arg sha "$EXPECTED_SOURCE" --arg version "$EXPECTED_VERSION" '
            .source.commit == $sha and .release.version == $version
          ' .modern/bleedingdev-publish/manifest.json

      # The exact same pinned interpreter prepare-release and every bundle job
      # use. It matters here because a rehearsal seeds its ephemeral registry
      # through the exact-artifact publisher, whose accepted-toolchain guard
      # refuses to publish under any Node.js or npm other than the one the
      # accepted manifest recorded - and that manifest was written under this
      # exact version. The acceptance runner projects the manifest's Node.js
      # and pnpm versions into Tractor before installing the cohort.
      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.13.1'

      - name: Bind the pinned acceptance interpreter
        run: |
          acceptance_node="$(command -v node)"
          [[ -x "$acceptance_node" ]]
          [[ "$("$acceptance_node" --version)" == "v26.13.1" ]]
          echo "ULTRAMODERN_ACCEPTANCE_NODE=$acceptance_node" >> "$GITHUB_ENV"

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.11.8
          cache_save: false
          working_directory: tractor

      - name: Provision Tractor acceptance dependencies
        working-directory: modernjs
        run: '"$ULTRAMODERN_ACCEPTANCE_NODE" scripts/ultramodern-publish/provision-tractor-acceptance.mjs'

      # One acceptance implementation for both lanes. `published` names the real
      # registry; `source` names none, because the runner starts its own
      # ephemeral registry from the downloaded immutable bundle and refuses any
      # non-loopback URL. Nothing here builds, packs, or rewrites a tarball.
      #
      # The acceptance process itself is launched from the pinned interpreter
      # bound above, because in source mode this process is also the one that
      # seeds the registry and must satisfy the publisher's accepted-toolchain
      # guard. The runner also binds workspace child commands to the accepted
      # interpreter and checks their Node.js version before installation.
      - name: Run exact-cohort Tractor acceptance
        id: tractor-acceptance
        working-directory: tractor
        env:
          MODE: ${{ inputs.mode }}
        run: |
          registry=()
          if [[ "$MODE" == "published" ]]; then
            registry=(--registry-url https://registry.npmjs.org/)
          fi
          mise exec -- "$ULTRAMODERN_ACCEPTANCE_NODE" \
            ../modernjs/scripts/ultramodern-production-readiness/run-tractor-downstream-acceptance.mjs \
            --mode "$MODE" \
            --manifest ../modernjs/.modern/bleedingdev-publish/manifest.json \
            --workspace . \
            "${registry[@]}" \
            --out ../modernjs/.modern/production-readiness/tractor-downstream-acceptance.json

      # Diagnostic inputs only, never passing or promotable acceptance evidence.
      # Preserve source and referenced declaration output separately to diagnose
      # native module-resolution failures after parallel app builds retire.
      - name: Preserve failed Tractor compiler inputs
        if: failure() && steps.tractor-acceptance.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tractor-compiler-failure-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ inputs.mode }}
          path: |
            tractor/packages/shared-contracts/src/**/*.ts
            tractor/packages/shared-contracts/tsconfig.json
            tractor/packages/shared-design-tokens/tsconfig.json
            tractor/tsconfig.base.json
            tractor/verticals/*/tsconfig.json
            tractor/verticals/*/.modern-js/tsgo/**/*.json
            tractor/node_modules/.cache/tsgo/**/*.d.ts
            tractor/node_modules/.cache/tsgo/**/*.tsbuildinfo
            modernjs/.modern/production-readiness/tractor-downstream-acceptance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      # Promotion is a published-lane concern only. A rehearsal binds nothing
      # and uploads nothing: its whole result is this job's own success, so
      # there is no source-mode artifact for anything downstream to consume.
      - name: Bind Tractor acceptance evidence
        id: evidence
        if: always() && inputs.mode == 'published'
        working-directory: modernjs
        env:
          TRACTOR_REF: ${{ steps.baseline.outputs.revision }}
        run: '"$ULTRAMODERN_ACCEPTANCE_NODE" scripts/ultramodern-publish/bind-tractor-acceptance-evidence.mjs'

      - name: Upload Tractor acceptance evidence
        if: always() && inputs.mode == 'published'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: modernjs/.modern/production-readiness/tractor-downstream-acceptance.json
          if-no-files-found: error
          include-hidden-files: true

      - name: Retain the accepted Tractor source commit
        if: success() && github.event_name == 'workflow_dispatch' && inputs.release_bundle_artifact == ''
        working-directory: modernjs
        run: '"$ULTRAMODERN_ACCEPTANCE_NODE" scripts/ultramodern-publish/export-tractor-acceptance-source.mjs'

      - name: Upload the accepted Tractor source
        if: success() && github.event_name == 'workflow_dispatch' && inputs.release_bundle_artifact == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tractor-retained-source-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: modernjs/.modern/production-readiness/tractor-source
          if-no-files-found: error
