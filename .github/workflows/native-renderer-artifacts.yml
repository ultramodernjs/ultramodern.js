name: Native renderer artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-renderer-artifacts-${{ github.sha }}
  cancel-in-progress: false

jobs:
  produce:
    if: github.repository == 'ultramodernjs/ultramodern.js' && github.repository_id == '1151231350' && github.ref == 'refs/heads/main-ultramodern' && github.actor == 'BleedingDev' && github.triggering_actor == 'BleedingDev'
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'depot-ubuntu-24.04-8' }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.13.1'
      - name: Install the owning build toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.11.8
          cache: false
          install_args: node@26.13.1 pnpm@11.21.0 pnpm@12.21.0
      - name: Qualify source and reconstruct exact npm layouts
        run: |
          NATIVE_ROUTER_PNPM="$(mise which pnpm --tool pnpm@11.21.0)"
          NATIVE_RUNTIME_PNPM="$(mise which pnpm --tool pnpm@12.21.0)"
          export NATIVE_ROUTER_PNPM NATIVE_RUNTIME_PNPM
          mise exec node@26.13.1 -- node scripts/ultramodern-renderers/native-artifacts/main.mjs produce "$RUNNER_TEMP/native-artifacts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-renderer-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-artifacts/*
          if-no-files-found: error
          retention-days: 14

  qualify:
    needs: produce
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'depot-ubuntu-24.04-8' }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.13.1'
      - name: Install the owning build toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.11.8
          cache: false
          install_args: node@26.13.1 pnpm@11.21.0 pnpm@12.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-renderer-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-artifacts
      - name: Qualify the actual reconstructed archives
        run: |
          NATIVE_ROUTER_PNPM="$(mise which pnpm --tool pnpm@11.21.0)"
          NATIVE_RUNTIME_PNPM="$(mise which pnpm --tool pnpm@12.21.0)"
          export NATIVE_ROUTER_PNPM NATIVE_RUNTIME_PNPM
          mise exec node@26.13.1 -- node scripts/ultramodern-renderers/native-artifacts/main.mjs qualify "$RUNNER_TEMP/native-artifacts"

  release:
    needs: [produce, qualify]
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'depot-ubuntu-24.04-8' }}
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.13.1'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-renderer-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-artifacts
      - name: Publish only the verified closed cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ultramodern-renderers/native-artifacts/main.mjs publish "$RUNNER_TEMP/native-artifacts"
