name: Unit Test (Windows)

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events but only for the main branch
  pull_request:
    branches: [main, main-ultramodern]

  merge_group:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  ut-windows-shards:
    # The type of runner that the job will run on
    runs-on: depot-windows-2025-16
    env:
      WINDOWS_UNIT_WORKERS: ${{ startsWith(matrix.lane, 'generator-') && 1 || 4 }}
    strategy:
      fail-fast: false
      matrix:
        # Cost-weighted lanes from the per-file measurement committed in
        # scripts/ci/windows-unit-selection.mjs, which also owns the
        # assignment. Keep this list equal to its windowsLanes: a lane that is
        # assigned work but never dispatched would skip those files silently.
        lane: ["1/2", "2/2", "generator-shell", "generator-workspace"]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.11.8
          cache_save: false
          install: true

      - name: Verify pinned test toolchain
        shell: bash
        run: |
          pnpm_version="$(pnpm --version)"
          node scripts/ci/check-test-toolchain.mjs "$pnpm_version"

      # Restore only; ci-cache.yml seeds file-only Windows snapshots on main.
      # Junctions are rebuilt natively, never extracted from the archive.
      - name: Restore Windows dependencies
        id: dependencies
        uses: ./.github/actions/installed-dependencies

      - name: Install Dependencies
        # A fresh checkout changes patch mtimes even on an exact snapshot hit.
        # Let pnpm revalidate its installed state and run genuine lifecycle
        # hooks; a script-only prepare cannot establish that state.
        run: pnpm install --frozen-lockfile

      - name: Restore prepared build outputs
        id: build-cache
        uses: ./.github/actions/restore-build-cache

      - name: Build Required Pkg
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm run build:required

      # scripts/lib/browser-provisioning.js is the one browser provisioner: it
      # reads the playwright the frozen install resolved for these runtimes,
      # and that version keys the browser cache.
      - name: Resolve Playwright runtime
        id: browser-runtime
        run: node scripts/lib/browser-provisioning.js --resolve --runtime tests/integration/rstest/basic-app-rstest-browser

      - name: Restore Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-runtime.outputs.cache_path }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      - name: Install Playwright browsers
        run: >-
          node scripts/lib/browser-provisioning.js --install --runtime tests/integration/rstest/basic-app-rstest-browser
          --version ${{ steps.browser-runtime.outputs.version }}

      - name: Verify dependency bundle module classification
        if: matrix.lane == '1/2'
        run: node --test --test-name-pattern="prebundle distinguishes" scripts/prebundle/ultramodern/packed-utils-consumer.test.mjs

      - name: Verify complete disjoint Windows test coverage
        if: matrix.lane == '1/2'
        shell: pwsh
        run: |
          node --test scripts/__tests__/windows-unit-selection.test.mjs scripts/ci/__tests__/dependency-snapshot.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ci/windows-unit-selection.mjs --verify

      - name: Report unit test resources
        run: >-
          node --input-type=module --eval "import os from 'node:os';
          console.log(JSON.stringify({platform:process.platform,
          availableParallelism:os.availableParallelism(),cpuCount:os.cpus().length,
          totalMemoryBytes:os.totalmem(),testFileWorkers:Number(process.env.WINDOWS_UNIT_WORKERS)}))"

      # Give each measured slow generator file its own runner. Remaining
      # ordinary lanes use four file workers on measured 16-core/64-GB VMs.
      # Keep the same eight ordinary workers on two VMs, plus two isolated
      # generators. Every file still runs once, with two fewer runner allocations.
      - name: Test
        env:
          WINDOWS_UNIT_LANE: ${{ matrix.lane }}
        # Git Bash prepends GNU tar, which interprets Windows drive paths as
        # remote archive hosts. Keep the runner's native Windows tool lookup.
        shell: pwsh
        run: >-
          pnpm run test:ut:prepared --config=scripts/ci/rstest-windows.config.mts
          --pool.maxWorkers=${{ env.WINDOWS_UNIT_WORKERS }} --reporters default --reporters blob

      # Keep exact per-file timings for the next balancing pass, including red
      # runs. Each lane writes its own blob on its isolated runner.
      - name: Upload unit test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ut-windows-${{ strategy.job-index }}
          path: .rstest-reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
