name: Unit Test (Windows)

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events but only for the main branch
  pull_request:
    branches: [main, main-ultramodern]

  merge_group:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  ut-windows-shards:
    # The type of runner that the job will run on
    runs-on: ${{ vars.DEPOT_WINDOWS_RUNNER || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: ordinary
            shard: 1/4
          - group: ordinary
            shard: 2/4
          - group: ordinary
            shard: 3/4
          - group: ordinary
            shard: 4/4
          - group: generators
            shard: ''

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache_save: false
          install: true

      - name: Verify pinned test toolchain
        shell: bash
        run: |
          pnpm_version="$(pnpm --version)"
          node scripts/ci/check-test-toolchain.mjs "$pnpm_version"

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Restore only; ci-cache.yml seeds this key on main-ultramodern.
      - name: Restore pnpm store cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Restore pnpm lockfile verification
        uses: ./.github/actions/restore-pnpm-verification

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore prepared build outputs
        id: build-cache
        uses: ./.github/actions/restore-build-cache

      - name: Build Required Pkg
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm run build:required

      # scripts/lib/browser-provisioning.js is the one browser provisioner: it
      # reads the playwright the frozen install resolved for these runtimes,
      # and that version keys the browser cache.
      - name: Resolve Playwright runtime
        id: browser-runtime
        run: node scripts/lib/browser-provisioning.js --resolve --runtime tests/integration/rstest/basic-app-rstest-browser

      - name: Restore Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-runtime.outputs.cache_path }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      - name: Install Playwright browsers
        run: >-
          node scripts/lib/browser-provisioning.js --install --runtime tests/integration/rstest/basic-app-rstest-browser
          --version ${{ steps.browser-runtime.outputs.version }}

      - name: Verify dependency bundle module classification
        run: node --test --test-name-pattern="prebundle distinguishes" scripts/prebundle/ultramodern/packed-utils-consumer.test.mjs

      - name: Verify complete disjoint Windows test coverage
        if: matrix.shard == '1/4'
        run: |
          node --test scripts/__tests__/windows-unit-selection.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ci/windows-unit-selection.mjs --verify

      - name: Report unit test resources
        run: >-
          node --input-type=module --eval "import os from 'node:os';
          console.log(JSON.stringify({platform:process.platform,
          availableParallelism:os.availableParallelism(),cpuCount:os.cpus().length,
          totalMemoryBytes:os.totalmem(),testFileWorkers:1}))"

      # Give the two measured slow generator files their own runner. Remaining
      # files also launch nested tools, so all five lanes keep one file worker.
      - name: Test
        env:
          WINDOWS_UNIT_GROUP: ${{ matrix.group }}
          WINDOWS_UNIT_SHARD: ${{ matrix.shard }}
        # Git Bash prepends GNU tar, which interprets Windows drive paths as
        # remote archive hosts. Keep the runner's native Windows tool lookup.
        shell: pwsh
        run: |
          $testArguments = @('--config=scripts/ci/rstest-windows.config.mts', '--pool.maxWorkers=1')
          if ($env:WINDOWS_UNIT_SHARD) {
            $testArguments += "--shard=$env:WINDOWS_UNIT_SHARD"
          }
          pnpm run test:ut:prepared @testArguments

  # Keep the original check name and fail it if any shard fails or is cancelled.
  ut-windows:
    if: ${{ always() }}
    needs: ut-windows-shards
    runs-on: ${{ vars.DEPOT_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Verify all unit test shards passed
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.ut-windows-shards.result }}
        run: |
          if [[ "$SHARD_RESULT" != "success" ]]; then
            echo "::error::Windows unit test shards finished with $SHARD_RESULT"
            exit 1
          fi
