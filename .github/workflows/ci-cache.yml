name: CI Cache

# The one writer of the dependency caches PR jobs restore. Caches saved on a
# PR ref are visible only to that PR, so per-PR saves parked one ~500 MB pnpm
# store (plus mise and browsers) per PR and OS and blew the 10 GB repository
# quota. Jobs on other refs restore only; this workflow saves on
# main-ultramodern, whose caches every ref can read.
on:
  push:
    branches: [main-ultramodern]

  # GitHub evicts entries nobody read for 7 days. A weekly refresh lands on
  # that boundary, so refresh twice a week to stay well inside it.
  schedule:
    - cron: '17 3 * * 1,4'

  workflow_dispatch:

concurrency:
  group: ci-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  seed:
    # workflow_dispatch accepts any ref; a seed there would park branch-scoped
    # entries again.
    if: github.ref == 'refs/heads/main-ultramodern'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ vars.DEPOT_LINUX_RUNNER || 'depot-ubuntu-24.04-8' }}
          - runner: ${{ vars.DEPOT_WINDOWS_RUNNER || 'depot-windows-2025-8' }}
          - runner: ${{ vars.DEPOT_MACOS_RUNNER || 'depot-macos-26' }}

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install: true

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Restoring first refreshes the entry's last-access time, so a quiet
      # week does not age it out; saving an existing immutable key would not.
      - name: Restore pnpm store cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore pnpm verification
        id: pnpm-verification
        uses: ./.github/actions/restore-pnpm-verification

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # pnpm writes this result only after its own policy verification passes.
      # Keep the writer on the trusted default branch; PR jobs restore only.
      - name: Validate pnpm verification seed
        if: steps.pnpm-verification.outputs.cache-hit != 'true'
        run: |
          pnpm_version="$(pnpm --version)"
          cache_directory="$(pnpm cache path)"
          node scripts/ci/pnpm-verification-cache.mjs seed "$pnpm_version" "$cache_directory"

      - name: Save pnpm verification
        if: steps.pnpm-verification.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-verification.outputs.path }}
          key: ${{ steps.pnpm-verification.outputs.key }}

      # Saved right after install, not in a post step, so a later failure
      # cannot skip the save.
      - name: Save pnpm store cache
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Every browser runtime resolves the same playwright (the provisioner
      # fails otherwise), so one runtime seeds the key all jobs restore.
      - name: Resolve Playwright runtime
        id: browser-runtime
        run: node scripts/lib/browser-provisioning.js --resolve --runtime tests/integration/rstest/basic-app-rstest-browser

      - name: Restore Playwright browser cache
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-runtime.outputs.cache_path }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      - name: Install Playwright browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: >-
          node scripts/lib/browser-provisioning.js --install --runtime tests/integration/rstest/basic-app-rstest-browser
          --version ${{ steps.browser-runtime.outputs.version }}

      - name: Save Playwright browser cache
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-runtime.outputs.cache_path }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      # Nx 23's local database is machine-specific. Transfer validated build
      # outputs with exact source/toolchain identity instead of its local DB.
      - name: Identify prepared build inputs
        id: build-cache-key
        run: node scripts/ci/prepared-build-cache.mjs key

      - name: Restore prepared build outputs
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-build-cache/snapshot
          key: ${{ steps.build-cache-key.outputs.key }}

      - name: Validate prepared build outputs
        id: build-cache-validate
        run: node scripts/ci/prepared-build-cache.mjs restore

      - name: Build required packages
        if: steps.build-cache-validate.outputs.cache-hit != 'true'
        run: pnpm run prepare-build

      # Genuine package lifecycle hooks run here once on the trusted source.
      # Consumers reuse these exact tarballs rather than repacking restored dist.
      - name: Pack prepared test prerequisites
        if: steps.build-cache-validate.outputs.cache-hit != 'true'
        run: node tests/utils/runWithPrerequisites.mjs --pack-only .ci-build-cache/packed

      - name: Snapshot prepared build outputs
        if: steps.build-cache-validate.outputs.cache-hit != 'true'
        run: node scripts/ci/prepared-build-cache.mjs snapshot .ci-build-cache/packed/packages.json

      - name: Save prepared build outputs
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-build-cache/snapshot
          key: ${{ steps.build-cache-key.outputs.key }}

  # Windows is the only platform where the frozen install is expensive after
  # the store is warm: 132 of its 143 s go into linking 2218 packages into
  # node_modules on NTFS (run 43825084105), against 3 s on Depot Linux and 6 s
  # on macOS. This leg saves that linked tree so the 15-19 Windows jobs of a
  # pull request restore it instead of rebuilding it each time. It is its own
  # job because the save must be conditioned on this platform's restore alone.
  # Unlike the seed leg above, this key exists on no ref: it is new, and the
  # repository has never held a linked Windows tree. A dispatch on a working
  # branch therefore writes the one entry that branch's own Windows jobs can
  # read, which is the only way to measure what the restore saves before the
  # change reaches the default branch. The seed leg stays default-branch-only
  # because its keys already exist there and every ref can read them, so a
  # branch copy would be the duplicate ~1 GB per branch the header records.
  #
  # Gated on the event, not on `startsWith(github.ref, 'refs/heads/')`: a
  # merge_group ref is `refs/heads/gh-readonly-queue/...`, so a ref-prefix
  # guard would park one entry per merge-queue entry. `schedule` is listed
  # because it is what refreshes the entry inside GitHub's 7-day eviction
  # window.
  seed-windows-dependencies:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ vars.DEPOT_WINDOWS_RUNNER || 'depot-windows-2025-8' }}
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache_save: false
          install: true

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.0'

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # The seed leg above owns this key; restore only, so a save here can
      # never race it.
      - name: Restore pnpm store cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Restore pnpm verification
        uses: ./.github/actions/restore-pnpm-verification

      # Restoring first refreshes the entry's last-access time and skips the
      # save, because saving an existing immutable key would do neither.
      #
      # Keep this path list and key byte-identical to
      # .github/actions/windows-dependencies/action.yml: actions/cache hashes
      # the literal path strings into the entry version, so any difference
      # between them is a permanent miss rather than a visible error.
      - name: Restore the linked Windows dependency tree
        id: windows-dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/*/node_modules
            packages/*/*/*/node_modules
            scripts/*/node_modules
            tests/node_modules
            tests/integration/*/node_modules
            tests/integration/*/*/node_modules
            tests/integration/*/*/*/node_modules
            tests/integration/*/*/*/*/node_modules
            tests/e2e/*/node_modules
            tests/e2e/*/*/node_modules
            tests/e2e/*/*/*/node_modules
            website/*/node_modules
            benchmark/*/node_modules
            examples/*/node_modules
            examples/*/*/node_modules
          key: windows-dependencies-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', '.mise.toml') }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # pnpm links the workspace with NTFS junctions into node_modules/.pnpm.
      # Whether the archiver stores those as links or follows them decides
      # whether this entry is a few hundred MB or several GB, and an oversized
      # entry evicts the live default-branch entries every job reads. Record
      # the real content size and the junction count next to the archive size
      # actions/cache prints, so the first run that ever writes this key leaves
      # the evidence instead of the next reader having to infer it.
      - name: Measure the linked Windows dependency tree
        if: steps.windows-dependencies.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "Real content under node_modules (links not followed):"
          du -sh node_modules
          echo "Workspace link targets outside node_modules:"
          find packages tests scripts -maxdepth 4 -name node_modules -type l 2>/dev/null | wc -l
          echo "Reparse points inside node_modules:"
          find node_modules -maxdepth 3 -type l 2>/dev/null | wc -l

      # Saved right after the install that pnpm's own policy verification
      # gated, and before anything builds or packs, so the entry holds exactly
      # the resolved workspace tree and the .pnpm virtual store.
      - name: Save the linked Windows dependency tree
        if: steps.windows-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/*/node_modules
            packages/*/*/*/node_modules
            scripts/*/node_modules
            tests/node_modules
            tests/integration/*/node_modules
            tests/integration/*/*/node_modules
            tests/integration/*/*/*/node_modules
            tests/integration/*/*/*/*/node_modules
            tests/e2e/*/node_modules
            tests/e2e/*/*/node_modules
            tests/e2e/*/*/*/node_modules
            website/*/node_modules
            benchmark/*/node_modules
            examples/*/node_modules
            examples/*/*/node_modules
          key: windows-dependencies-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', '.mise.toml') }}
