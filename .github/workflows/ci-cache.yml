name: CI Cache

# The one writer of the dependency caches PR jobs restore. Caches saved on a
# PR ref are visible only to that PR, so per-PR saves parked one ~500 MB pnpm
# store (plus mise and browsers) per PR and OS and blew the 10 GB repository
# quota. Jobs on ephemeral refs restore only. This workflow saves on
# main-ultramodern (readable everywhere), or on an explicitly dispatched
# durable branch to measure a new snapshot before merging it.
on:
  push:
    branches: [main-ultramodern]

  # GitHub evicts entries nobody read for 7 days. A weekly refresh lands on
  # that boundary, so refresh twice a week to stay well inside it.
  schedule:
    - cron: "17 3 * * 1,4"

  workflow_dispatch:

concurrency:
  group: ci-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  effect-compiler-payload:
    if: github.ref == 'refs/heads/main-ultramodern' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/effect-compiler-payload.yml

  seed:
    # Explicit dispatch can warm a durable development branch for measurement.
    # PR and merge-queue refs never write caches.
    if: github.ref == 'refs/heads/main-ultramodern' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ vars.DEPOT_LINUX_RUNNER || 'depot-ubuntu-24.04-8' }}
            compiler_payload: false
          - runner: depot-windows-2025-16
            compiler_payload: false
          - runner: ${{ vars.DEPOT_MACOS_RUNNER || 'depot-macos-26' }}
            compiler_payload: false

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        shell: bash

    steps: &seed-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install: true
          cache_save: ${{ matrix.compiler_payload == false }}

      - name: Setup Node.js 26.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.0"

      - name: Identify Windows dependency snapshot
        id: windows-identity
        if: runner.os == 'Windows'
        run: node scripts/ci/windows-dependency-snapshot.mjs key

      - name: Restore Windows dependency snapshot
        id: windows-snapshot
        if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-windows-dependencies/snapshot
          key: ${{ steps.windows-identity.outputs.key }}

      - name: Rebuild native Windows dependency links
        if: runner.os == 'Windows' && steps.windows-snapshot.outputs.cache-hit == 'true'
        run: node scripts/ci/windows-dependency-snapshot.mjs restore

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Restoring first refreshes the entry's last-access time, so a quiet
      # week does not age it out; saving an existing immutable key would not.
      - name: Restore pnpm store cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore pnpm verification
        id: pnpm-verification
        uses: ./.github/actions/restore-pnpm-verification

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # pnpm writes this result only after its own policy verification passes.
      # Keep the writer on the trusted default branch; PR jobs restore only.
      - name: Validate pnpm verification seed
        if: github.ref == 'refs/heads/main-ultramodern' && matrix.compiler_payload == false && steps.pnpm-verification.outputs.cache-hit != 'true'
        run: |
          pnpm_version="$(pnpm --version)"
          cache_directory="$(pnpm cache path)"
          node scripts/ci/pnpm-verification-cache.mjs seed "$pnpm_version" "$cache_directory"

      - name: Save pnpm verification
        if: github.ref == 'refs/heads/main-ultramodern' && matrix.compiler_payload == false && steps.pnpm-verification.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-verification.outputs.path }}
          key: ${{ steps.pnpm-verification.outputs.key }}

      # Saved right after install, not in a post step, so a later failure
      # cannot skip the save.
      - name: Save pnpm store cache
        if: matrix.compiler_payload == false && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Every browser runtime resolves the same playwright (the provisioner
      # fails otherwise), so one runtime seeds the key all jobs restore.
      - name: Resolve Playwright runtime
        id: browser-runtime
        run: node scripts/lib/browser-provisioning.js --resolve --runtime tests/integration/rstest/basic-app-rstest-browser

      - name: Restore Playwright browser cache
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-runtime.outputs.cache_path }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      - name: Install Playwright browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: >-
          node scripts/lib/browser-provisioning.js --install --runtime tests/integration/rstest/basic-app-rstest-browser
          --version ${{ steps.browser-runtime.outputs.version }}

      - name: Save Playwright browser cache
        if: matrix.compiler_payload == false && steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-runtime.outputs.cache_path }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      - name: Download corrected Effect compiler payload
        if: matrix.compiler_payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: effect-compiler-payload-${{ github.sha }}
          path: .modern/effect-compiler-input

      - name: Validate and restage corrected Effect compiler payload
        if: matrix.compiler_payload
        run: node scripts/ultramodern-publish/stage-effect-compiler-payload.mjs stage --input .modern/effect-compiler-input --complete-manifest

      # Nx 23's local database is machine-specific. Transfer validated build
      # outputs with exact source/toolchain identity instead of its local DB.
      - name: Identify prepared build inputs
        id: build-cache-key
        run: node scripts/ci/prepared-build-cache.mjs key

      - name: Restore prepared build outputs
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-build-cache/snapshot
          key: ${{ steps.build-cache-key.outputs.key }}

      - name: Validate prepared build outputs
        id: build-cache-validate
        run: node scripts/ci/prepared-build-cache.mjs restore

      - name: Build required packages
        if: steps.build-cache-validate.outputs.cache-hit != 'true'
        run: pnpm run prepare-build

      # Genuine package lifecycle hooks run here once on the trusted source.
      # Consumers reuse these exact tarballs rather than repacking restored dist.
      - name: Pack prepared test prerequisites
        if: steps.build-cache-validate.outputs.cache-hit != 'true'
        run: node tests/utils/runWithPrerequisites.mjs --pack-only .ci-build-cache/packed

      - name: Snapshot prepared build outputs
        if: steps.build-cache-validate.outputs.cache-hit != 'true'
        run: node scripts/ci/prepared-build-cache.mjs snapshot .ci-build-cache/packed/packages.json

      - name: Save prepared build outputs
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-build-cache/snapshot
          key: ${{ steps.build-cache-key.outputs.key }}

      # Snapshot last: moving regular trees avoids a second copy of 2 GB.
      # Installation and all genuine native install hooks have already passed.
      - name: Encode Windows dependency links and snapshot regular files
        if: runner.os == 'Windows' && matrix.compiler_payload == false && steps.windows-snapshot.outputs.cache-hit != 'true'
        run: node scripts/ci/windows-dependency-snapshot.mjs snapshot

      # Consumer jobs restore this archive and execute the native tools before
      # testing; a second local tar round trip duplicates that proof.
      - name: Save Windows dependency snapshot
        if: runner.os == 'Windows' && matrix.compiler_payload == false && steps.windows-snapshot.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-windows-dependencies/snapshot
          key: ${{ steps.windows-identity.outputs.key }}

  # Only these two builds consume the same-run corrected compiler artifact.
  # Dependency, browser and unit-build caches start alongside its producer.
  seed-integration:
    needs: effect-compiler-payload
    if: github.ref == 'refs/heads/main-ultramodern' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ vars.DEPOT_LINUX_RUNNER || 'depot-ubuntu-24.04-8' }}
            compiler_payload: true
          - runner: depot-windows-2025-16
            compiler_payload: true
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps: *seed-steps
