name: Restore installed dependencies
description: Restore regular installed files, rebuild native links and restore pnpm verification before frozen install
inputs:
  store-required:
    description: Fresh fixture installations need the pnpm store in addition to installed files
    default: 'true'
outputs:
  cache-hit:
    description: True only when the exact installed-file snapshot was restored
    value: ${{ steps.snapshot.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Identify installed dependency snapshot
      id: identity
      shell: bash
      run: node scripts/ci/dependency-snapshot.mjs key

    # No NTFS reparse point crosses tar. The seed strips links into a relative
    # manifest; restore creates junctions on Windows and symlinks on macOS.
    - name: Restore installed files
      id: snapshot
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ci-dependencies/snapshot
        key: ${{ steps.identity.outputs.key }}

    - name: Rebuild native dependency links
      if: steps.snapshot.outputs.cache-hit == 'true'
      shell: bash
      run: |
        node scripts/ci/dependency-snapshot.mjs restore
        node scripts/ultramodern-node-policy/check-node-version.mjs

    # Generator/consumer tests install fresh applications. Keep their store
    # warm too; the installed-file snapshot replaces linking, not this store.
    - name: Resolve pnpm store path
      id: pnpm-store
      if: steps.snapshot.outputs.cache-hit != 'true' || inputs.store-required == 'true'
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store cache
      if: steps.snapshot.outputs.cache-hit != 'true' || inputs.store-required == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Restore pnpm lockfile verification
      uses: ./.github/actions/restore-pnpm-verification
