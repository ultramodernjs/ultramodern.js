name: Restore Windows dependencies
description: Restore regular installed files and rebuild native junctions; install only on an exact snapshot miss
outputs:
  cache-hit:
    description: True only when the exact installed-file snapshot was restored
    value: ${{ steps.snapshot.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Identify Windows dependency snapshot
      id: identity
      shell: bash
      run: node scripts/ci/windows-dependency-snapshot.mjs key

    # No NTFS reparse point crosses tar. The seed strips links into a relative
    # manifest; restore recreates them through Node's native junction API.
    - name: Restore installed Windows files
      id: snapshot
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ci-windows-dependencies/snapshot
        key: ${{ steps.identity.outputs.key }}

    - name: Rebuild native Windows dependency links
      if: steps.snapshot.outputs.cache-hit == 'true'
      shell: pwsh
      run: |
        node scripts/ci/windows-dependency-snapshot.mjs restore
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        node scripts/ultramodern-node-policy/check-node-version.mjs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Resolve pnpm store path
      id: pnpm-store
      if: steps.snapshot.outputs.cache-hit != 'true'
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store cache
      if: steps.snapshot.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Restore pnpm lockfile verification
      if: steps.snapshot.outputs.cache-hit != 'true'
      uses: ./.github/actions/restore-pnpm-verification

