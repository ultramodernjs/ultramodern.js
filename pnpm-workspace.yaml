  'lodash-es@>=4.0.0 <4.18.1': 4.18.1
  'tmp@>=0.2.0 <0.2.7': 0.2.7
  'minimatch@3>brace-expansion': 1.1.21
  'minimatch@9>brace-expansion': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'undici@>=8.0.0 <8.12.2': 8.12.2
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'yaml@>=1.0.0 <1.10.3': 1.10.3
  'yaml@>=2.0.0 <2.9.1': 2.9.1
  'qs@>=6.0.0 <6.16.0': 6.16.0
  'smol-toml@>=1.0.0 <1.9.0': 1.9.0
