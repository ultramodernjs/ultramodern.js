packages:
  - 'packages/*'
  - 'packages/cli/*'
  - 'packages/document/*'
  - 'packages/runtime/*'
  - 'packages/generator/*'
  - 'packages/generator/generators/*'
  - 'packages/generator/plugins/*'
  - 'packages/review/*'
  - 'packages/server/*'
  - 'packages/module/*'
  - 'packages/solutions/*'
  - 'packages/toolkit/*'
  - 'packages/toolkit/compiler/*'
  - 'scripts/*'
  - 'tests'
  # Keep fixture discovery depth-bounded. Recursive `**/*` walks workspace
  # node_modules symlink graphs before downstream tools apply exclusions.
  - 'tests/integration/*'
  - 'tests/integration/*/*'
  - 'tests/integration/*/*/*'
  - 'tests/integration/*/*/*/*'
  - 'tests/e2e/*'
  - 'tests/e2e/*/*'
  - 'tests/e2e/*/*/*'
  - 'website/*'
  - 'benchmark/*'
  - 'examples/*'
  - 'examples/deploy/*'
  - 'examples/module-federation/*/*'
  # FORK: gitignored build output under tests/integration/** contains emitted
  # package.json files (e.g. routes-tanstack-mf/mf-remote/dist/shared/effect and
  # bff-cross-project/bff-api-app/dist-1/client)
  # that match the globs above, so a local `pnpm install` on a dirty tree adds
  # phantom importers to pnpm-lock.yaml. Upstream has no such emitted manifests.
  - '!tests/integration/**/dist'
  - '!tests/integration/**/dist/**'
  - '!tests/integration/**/dist-*'
  - '!tests/integration/**/dist-*/**'
  - '!tests/integration/**/node_modules'
  - '!tests/integration/**/node_modules/**'

autoInstallPeers: false
linkWorkspacePackages: false
strictPeerDependencies: false
# Installs are explicit serialized stages; test/build commands must not relink
# the shared dependency graph as a side effect.
verifyDepsBeforeRun: error

allowBuilds:
  '@biomejs/biome': true
  '@parcel/watcher': true
  '@swc/core': true
  bufferutil: true
  core-js: true
  # Browser binaries are installed explicitly (examples/test-cypress and
  # scripts/lib/browser-provisioning.js), never as install side effects.
  cypress: false
  es5-ext: true
  esbuild: true
  nx: true
  puppeteer: false
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  workerd: true

patchedDependencies:
  'rsbuild-plugin-dts@1.0.7': patches/rsbuild-plugin-dts@1.0.7.patch
  '@svgr/babel-plugin-transform-svg-component@8.0.0': patches/@svgr__babel-plugin-transform-svg-component@8.0.0.patch
  'braces@3.0.3': patches/braces@3.0.3.patch
  '@module-federation/sdk@2.9.3': patches/@module-federation__sdk@2.9.3.patch
overrides:
  # Minimum versions that contain the October 2026 advisory fixes.
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'proxy-addr@>=2.0.0 <2.0.8': 2.0.8
  # Keep Miniflare and image plugins on one compatible Sharp native patch.
  'sharp@>=0.35.0 <0.35.5': 0.35.5
  'axios@>=1.0.0 <1.20.0': 1.21.1
  'engine.io@>=6.0.0 <6.6.10': 6.6.11
  # Each key closes an advisory range inside one major and pins the fix from
  # that major, so no dependent is forced onto a major it never declared.
  # scripts/check-overrides.mjs enforces this.
  'micromatch@>=4.0.0 <4.0.8': 4.0.8
  'js-yaml@>=3.0.0 <3.15.2': 3.15.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  # Close the affected router ranges within each major. Workspace packages pin
  # their own router version in package.json, never through a parent selector.
  'react-router@>=7.0.0 <7.18.2': 7.18.4
  'react-router@>=8.0.0 <8.3.1': 8.5.1
  'tar@>=7.0.0 <7.5.22': 7.5.23
  'diff@>=4.0.0 <4.0.4': 4.0.4
  'debug@>=4.0.0 <4.4.3': 4.4.3
  'cross-spawn@>=7.0.0 <7.0.6': 7.0.6
  'lodash-es@>=4.0.0 <4.18.1': 4.18.1
  'tmp@>=0.2.0 <0.2.7': 0.2.7
  'minimatch@3>brace-expansion': 1.1.21
  'minimatch@9>brace-expansion': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.13
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'undici@>=8.0.0 <8.12.2': 8.12.4
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'yaml@>=1.0.0 <1.10.3': 1.10.3
  # Admit the native serializer releases together.
  'seroval@>=1.0.0 <1.8.1': 1.8.2
  'seroval-plugins@>=1.0.0 <1.8.0': 1.8.0
  'yaml@>=2.0.0 <2.9.1': 2.9.1
  'qs@>=6.0.0 <6.16.0': 6.17.1
  'smol-toml@>=1.0.0 <1.9.0': 1.9.1
  'dompurify@>=3.0.0 <3.4.17': 3.4.18
  'serialize-javascript@>=7.0.0 <7.1.2': 7.1.4
  'ws@>=7.0.0 <7.5.11': 7.5.11
  'ws@>=8.0.0 <8.23.0': 8.23.0
  # Keep the published wildcard peer; security overrides still cover runtime edges.
  'isomorphic-ws@5.0.0>ws:peer': '*'
  'fast-uri@>=3.0.0 <3.1.6': 3.1.8
  'follow-redirects@>=1.0.0 <1.16.2': 1.16.3
  'handlebars@>=4.0.0 <4.7.10': 4.7.10
  'postcss-selector-parser@>=7.0.0 <7.1.6': 7.2.1
  'picomatch@>=2.0.0 <2.3.2': 2.3.2
  'picomatch@>=4.0.0 <4.0.4': 4.0.7
  'socket.io@4.8.1>socket.io-parser': 4.2.7
  'svgo@>=3.0.0 <3.3.5': 3.3.5
  'svgo@>=4.0.0 <4.1.0': 4.1.0

peerDependencyRules:
  ignoreMissing:
    - ioredis
    - webpack
  allowedVersions:
    '@module-federation/sdk>node-fetch': 3.3.0
    'fdir@6.5.0>picomatch': 4.0.5
    'react-side-effect@2.1.2>react': '19'

allowedDeprecatedVersions:
  '@babel/plugin-proposal-object-rest-spread': 7.12.1 || 7.20.7
  '@babel/plugin-proposal-private-property-in-object': 7.21.0
  '@financial-times/polyfill-useragent-normaliser': 1.10.2
  formidable: 1.2.6
  sourcemap-codec: 1.4.8
  js-polyfills: 0.1.43
  picturefill: 3.0.3
  querystring: 0.2.0
  string-similarity: 4.0.4
  source-map-resolve: 0.6.0 || 0.5.3
  '@formatjs/intl-utils': 3.8.4
  debug: 4.1.1
  uuid: 3.4.0
  trim: 0.0.1

minimumReleaseAge: 0

# Reviewed exact compiler release; keep no-downgrade for every other release.
trustPolicyExclude:
  - 'tsrs@7.1.0-beta.tsrs3'
