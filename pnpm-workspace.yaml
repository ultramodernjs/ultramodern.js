packages:
  - 'packages/*'
  - 'packages/cli/*'
  - 'packages/document/*'
  - 'packages/runtime/*'
  - 'packages/generator/*'
  - 'packages/generator/generators/*'
  - 'packages/generator/plugins/*'
  - 'packages/review/*'
  - 'packages/server/*'
  - 'packages/module/*'
  - 'packages/solutions/*'
  - 'packages/toolkit/*'
  - 'packages/toolkit/compiler/*'
  - 'scripts/*'
  - 'tests'
  # Keep fixture discovery depth-bounded. Recursive `**/*` walks workspace
  # node_modules symlink graphs before downstream tools apply exclusions.
  - 'tests/integration/*'
  - 'tests/integration/*/*'
  - 'tests/integration/*/*/*'
  - 'tests/integration/*/*/*/*'
  - 'tests/e2e/*'
  - 'tests/e2e/*/*'
  - 'tests/e2e/*/*/*'
  - 'website/*'
  - 'benchmark/*'
  - 'examples/*'
  - 'examples/deploy/*'
  - 'examples/module-federation/*/*'
  # FORK: gitignored build output under tests/integration/** contains emitted
  # package.json files (e.g. routes-tanstack-mf/mf-remote/dist/shared/effect and
  # bff-cross-project/bff-api-app/dist-1/client)
  # that match the globs above, so a local `pnpm install` on a dirty tree adds
  # phantom importers to pnpm-lock.yaml. Upstream has no such emitted manifests.
  - '!tests/integration/**/dist'
  - '!tests/integration/**/dist/**'
  - '!tests/integration/**/dist-*'
  - '!tests/integration/**/dist-*/**'
  - '!tests/integration/**/node_modules'
  - '!tests/integration/**/node_modules/**'

autoInstallPeers: false
linkWorkspacePackages: false
strictPeerDependencies: false
# Installs are explicit serialized stages; test/build commands must not relink
# the shared dependency graph as a side effect.
verifyDepsBeforeRun: error

allowBuilds:
  '@biomejs/biome': true
  '@parcel/watcher': true
  '@swc/core': true
  bufferutil: true
  core-js: true
  # Browser binaries are installed explicitly (examples/test-cypress and
  # scripts/lib/browser-provisioning.js), never as install side effects.
  cypress: false
  es5-ext: true
  esbuild: true
  nx: true
  puppeteer: false
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  workerd: true

patchedDependencies:
  '@tanstack/router-core@1.171.37': patches/@tanstack__router-core@1.171.37.patch
  'braces@3.0.3': patches/braces@3.0.3.patch
  '@module-federation/bridge-react@2.9.2': patches/@module-federation__bridge-react@2.9.2.patch
  '@module-federation/dts-plugin@2.9.2': patches/@module-federation__dts-plugin@2.9.2.patch
  '@module-federation/manifest@2.9.2': patches/@module-federation__manifest@2.9.2.patch
  '@module-federation/modern-js-v3@2.9.2': patches/@module-federation__modern-js-v3@2.9.2.patch
  '@module-federation/node@2.7.52': patches/@module-federation__node@2.7.52.patch
  '@module-federation/rspack@2.9.2': patches/@module-federation__rspack@2.9.2.patch
  '@module-federation/runtime-core@2.9.2': patches/@module-federation__runtime-core@2.9.2.patch
  '@module-federation/sdk@2.9.2': patches/@module-federation__sdk@2.9.2.patch
overrides:
  # Minimum versions that contain the October 2026 advisory fixes.
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'proxy-addr@>=2.0.0 <2.0.8': 2.0.8
  # Keep Miniflare and image plugins on one compatible Sharp native patch.
  'sharp@>=0.35.0 <0.35.5': 0.35.5
  'axios@>=1.0.0 <1.20.0': 1.20.0
  'engine.io@>=6.0.0 <6.6.10': 6.6.11
  # Each key closes an advisory range inside one major and pins the fix from
  # that major, so no dependent is forced onto a major it never declared.
  # scripts/check-overrides.mjs enforces this.
  'micromatch@>=4.0.0 <4.0.8': 4.0.8
  'js-yaml@>=3.0.0 <3.15.2': 3.15.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  # Close the affected router ranges within each major. Workspace packages pin
  # their own router version in package.json, never through a parent selector.
  'react-router@>=7.0.0 <7.18.2': 7.18.4
  'react-router@>=8.0.0 <8.3.1': 8.4.0
  'tar@>=7.0.0 <7.5.22': 7.5.22
  'diff@>=4.0.0 <4.0.4': 4.0.4
  'debug@>=4.0.0 <4.4.3': 4.4.3
