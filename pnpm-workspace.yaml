  'ws@>=8.0.0 <8.21.3': 8.21.3
  'fast-uri@>=3.0.0 <3.1.6': 3.1.8
  'follow-redirects@>=1.0.0 <1.16.0': 1.16.0
  'handlebars@>=4.0.0 <4.7.10': 4.7.10
  'postcss-selector-parser@>=7.0.0 <7.1.6': 7.1.6
  'picomatch@>=2.0.0 <2.3.2': 2.3.2
  'picomatch@>=4.0.0 <4.0.4': 4.0.7
  'socket.io@4.8.1>socket.io-parser': 4.2.7
  'svgo@>=3.0.0 <3.3.5': 3.3.5
  'svgo@>=4.0.0 <4.1.0': 4.1.0

