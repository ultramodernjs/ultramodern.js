# Depot CI Migration
# Source: .github/workflows/workflow-security.yml
#
# Linux jobs use Depot runners. GitHub workflows stay active during validation.

name: Workflow Security

on:
  # No path filter: bare-checkout jobs load a static import closure that can
  # reach any tracked file, so any change can break it.
  pull_request:
  push:
    branches:
      - main-ultramodern
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  workflow-security:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.13.1'

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.11.8
          cache_save: false
          install_args: node@26.13.1

      - name: Install workflow parser
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts --filter @scripts/prebundle

      - name: Generate workflow parser
        run: mise exec -- pnpm --filter @scripts/prebundle start js-yaml

      - name: Run validator unit tests
        run: |
          node --test scripts/security/__tests__/*.test.mjs
          node --test scripts/ci/__tests__/*.test.mjs
          node --test scripts/__tests__/workflow-cache-writers.test.mjs
          node --test scripts/ultramodern-publish/__tests__/build-bleedingdev-packages.test.js
          node --test scripts/ultramodern-production-readiness/__tests__/*.test.js

      - name: Run native archive control tests
        run: |
          work="$(mktemp -d "$RUNNER_TEMP/native-controls.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          OWNED_TEMP_DIR="$work" mise exec node@26.13.1 -- node --test scripts/ultramodern-renderers/native-artifacts/*.test.mjs

      - name: Validate workflow security
        run: node scripts/security/validate-github-workflows.mjs

      - name: Run support archive control tests
        run: |
          work="$(mktemp -d "$RUNNER_TEMP/support-controls.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          OWNED_TEMP_DIR="$work" mise exec node@26.13.1 -- node --test scripts/ultramodern-artifacts/*.test.mjs scripts/ultramodern-support-artifacts/*.test.mjs
