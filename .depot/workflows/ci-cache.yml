# Depot CI Migration
# Source: .github/workflows/ci-cache.yml
#
# Linux jobs use Depot runners. GitHub workflows stay active during validation.

name: CI Cache

# Seed dependency caches from the trusted default branch. PR jobs restore
# caches without writing them. Depot cache storage is separate from GitHub.
# Provider comparisons are explicit runs. Required GitHub Actions workflows
# already execute these suites on Depot; automatic mirrors duplicate that work.
on:
  workflow_dispatch:

concurrency:
  group: ci-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  seed:
    # Only the default branch can write shared dependency caches.
    if: github.ref == 'refs/heads/main-ultramodern'
    runs-on: depot-ubuntu-24.04-8

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.11.8
          install: true

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.13.1'

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Restoring first refreshes the entry's last-access time, so a quiet
      # week does not age it out; saving an existing immutable key would not.
      - name: Restore pnpm store cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Saved right after install, not in a post step, so a later failure
      # cannot skip the save.
      - name: Save pnpm store cache
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Every browser runtime resolves the same playwright (the provisioner
      # fails otherwise), so one runtime seeds the key all jobs restore.
      - name: Resolve Playwright runtime
        id: browser-runtime
        run: node scripts/lib/browser-provisioning.js --resolve --runtime tests/integration/rstest/basic-app-rstest-browser

      - name: Restore Playwright browser cache
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-runtime.outputs.cache_path }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      - name: Install Playwright browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: >-
          node scripts/lib/browser-provisioning.js --install --runtime tests/integration/rstest/basic-app-rstest-browser
          --version ${{ steps.browser-runtime.outputs.version }}

      - name: Save Playwright browser cache
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-runtime.outputs.cache_path }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      # Nx 23's local database is machine-specific. Transfer validated build
      # outputs with exact source/toolchain identity instead of its local DB.
      - name: Identify prepared build inputs
        id: build-cache-key
        run: node scripts/ci/prepared-build-cache.mjs key

      - name: Restore prepared build outputs
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-build-cache/snapshot
          key: ${{ steps.build-cache-key.outputs.key }}

      - name: Validate prepared build outputs
        id: build-cache-validate
        run: node scripts/ci/prepared-build-cache.mjs restore

      - name: Build required packages
        if: steps.build-cache-validate.outputs.cache-hit != 'true'
        run: pnpm run prepare-build

      # Genuine package lifecycle hooks run here once on the trusted source.
      # Consumers reuse these exact tarballs rather than repacking restored dist.
      - name: Pack prepared test prerequisites
        if: steps.build-cache-validate.outputs.cache-hit != 'true'
        run: node tests/utils/runWithPrerequisites.mjs --pack-only .ci-build-cache/packed

      - name: Snapshot prepared build outputs
        if: steps.build-cache-validate.outputs.cache-hit != 'true'
        run: node scripts/ci/prepared-build-cache.mjs snapshot .ci-build-cache/packed/packages.json

      - name: Save prepared build outputs
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-build-cache/snapshot
          key: ${{ steps.build-cache-key.outputs.key }}
