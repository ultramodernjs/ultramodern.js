# Depot CI Migration
# Source: .github/workflows/native-compatibility.yml
#
# Linux jobs use Depot runners. GitHub workflows stay active during validation.

name: Native Compatibility

# Provider comparisons are explicit runs. Required GitHub Actions workflows
# already execute these suites on Depot; automatic mirrors duplicate that work.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-compatibility:
    name: native-compatibility
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.11.8
          cache_save: false
          install: true

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.13.1'

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Restore only; ci-cache.yml seeds this key on main-ultramodern.
      - name: Restore pnpm store cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        run: pnpm run prepare-build

      - name: Resolve Playwright runtime
        id: browser-runtime
        run: node scripts/lib/browser-provisioning.js --resolve --runtime tests

      - name: Restore Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-runtime.outputs.cache_path }}
          key: ${{ steps.browser-runtime.outputs.cache_key }}

      - name: Install Playwright browsers
        run: >-
          node scripts/lib/browser-provisioning.js --install --runtime tests
          --version ${{ steps.browser-runtime.outputs.version }}

      - name: Test native compatibility
        run: pnpm run validate:native-compatibility --prepared
